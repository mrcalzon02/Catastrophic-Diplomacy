plugins { id 'java-library' }
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }
dependencies {
    api project(':core')
    api 'com.badlogicgames.gdx:gdx:1.14.2'
}

tasks.register('geometrySmoke', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.client.HullSilhouetteTest'
}


// Headless verification of deterministic event-to-sound routing on the shared client.
tasks.register('audioSmoke', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.client.CombatAudioCueTest'
}

tasks.register('spatialAudioSmoke', JavaExec) {
    group = 'verification'
    description = 'Headless zoom/distance spatial-audio and deterministic WAV synthesis checks.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.client.SpatialAudioTest'
}
tasks.named('audioSmoke') { finalizedBy(tasks.named('spatialAudioSmoke')) }

tasks.register('menuFlowSmoke', JavaExec) {
    group = 'verification'
    description = 'Verify playable main-menu, skirmish, campaign faction and star-map touch routing.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.client.GameMenuFlowTest'
}

// Tested without an OpenGL context: ignition-only exhaust, pause fidelity,
// real event bursts and bounded smoke/light timelines.
tasks.register('lightingSmoke', JavaExec) {
    group = 'verification'
    description = 'Verify combat lighting simulation integration and smoke budgets.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.client.CombatLightingModelTest'
}
// Existing release CI already executes menuFlowSmoke on desktop + Windows,
// so this functional lighting test is not an orphan or a new workflow.
tasks.named('menuFlowSmoke') { dependsOn tasks.named('lightingSmoke') }


tasks.register('announcerSmoke', JavaExec) {
    group = 'verification'
    description = 'Headless validation of all 30 ordered, unique recorded narrator cue paths.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.client.AnnouncerAudioTest'
}
tasks.named('audioSmoke') { finalizedBy(tasks.named('announcerSmoke')) }


tasks.register('fighterVoiceSmoke', JavaExec) {
    group = 'verification'
    description = 'Headless validation of all 234 original subtitle-to-OGG mappings across 9 hull voice roles.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.client.FighterVoiceAudioTest'
}
tasks.named('audioSmoke') { finalizedBy(tasks.named('fighterVoiceSmoke')) }

// Release CI already invokes menuFlowSmoke: prove voice routing in those builds too.
tasks.named('menuFlowSmoke') { dependsOn tasks.named('fighterVoiceSmoke') }

tasks.register('battleTouchSmoke', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.client.BattleTouchNavigationTest'
}

tasks.register('screensaverCameraSmoke', JavaExec) {
    group = 'verification'
    description = 'Verify timed seeded ship tracking, gentle pans, faction rotation and death retargeting.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.client.ScreensaverCameraDirectorTest'
}
// Existing multiplatform release checks run menuFlowSmoke; require this director
// regression there, rather than leaving a diagnostic-only test unexecuted.
tasks.named('menuFlowSmoke') { dependsOn tasks.named('screensaverCameraSmoke') }

tasks.register('renderPosesSmoke', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.client.BattleRenderPosesTest'
}
tasks.named('menuFlowSmoke') { dependsOn tasks.named('renderPosesSmoke') }
