plugins { id 'application' }
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }
dependencies {
    implementation project(':game')
    implementation 'com.badlogicgames.gdx:gdx-backend-lwjgl3:1.14.2'
    runtimeOnly 'com.badlogicgames.gdx:gdx-platform:1.14.2:natives-desktop'
}
application { mainClass = 'diplomacy.desktop.DesktopLauncher' }
// Internal libGDX file paths must resolve identically on desktop and Android.
tasks.register('stageDesktopAssets', Sync) {
    dependsOn rootProject.tasks.named('prepareUiAssets')
    dependsOn rootProject.tasks.named('prepareStage1Art')
    dependsOn rootProject.tasks.named('prepareFighterArt')
    dependsOn rootProject.tasks.named('verifyBattlefieldResources')
    dependsOn rootProject.tasks.named('verifyBattleAudioResources')
    dependsOn rootProject.tasks.named('verifyGrittyUiAssets')
    from(rootProject.file('assets'))
    from(rootProject.layout.buildDirectory.dir('generated/cd-ui'))
    from(rootProject.layout.buildDirectory.dir('generated/cd-music'))
    from(rootProject.layout.buildDirectory.dir('generated/cd-stage1'))
    from(rootProject.layout.buildDirectory.dir('generated/cd-fighters'))
    into(layout.buildDirectory.dir('runtime-assets'))
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
run {
    dependsOn tasks.named('stageDesktopAssets')
    workingDir layout.buildDirectory.dir('runtime-assets').get().asFile
}

// Embed precisely the same verified runtime resources in the application JAR.
// LWJGL3's internal file loader can then resolve them from the classpath even
// when a Windows/Linux launcher is started outside the installation directory.
tasks.named('jar') {
    dependsOn tasks.named('stageDesktopAssets')
    from(layout.buildDirectory.dir('runtime-assets'))
    duplicatesStrategy = DuplicatesStrategy.FAIL
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}

// Embed the actual release tag. Desktop must NEVER trust the stale project
// version (0.1.0-SNAPSHOT) when checking GitHub's published release sequence.
def generatedReleaseTag = layout.buildDirectory.file('generated/update-tag/cd-update-tag.txt')
tasks.register('generateDesktopReleaseTag') {
    inputs.file(rootProject.file('android/build.gradle'))
    outputs.file(generatedReleaseTag)
    doLast {
        def androidScript = rootProject.file('android/build.gradle').text
        def match = (androidScript =~ /versionName\s+'([^']+)'/)
        if (!match.find()) throw new GradleException('Android release versionName not found')
        def versionName = match.group(1)
        if (!(versionName ==~ /[A-Za-z0-9][A-Za-z0-9._+-]{0,99}/))
            throw new GradleException('Invalid updater release version')
        def output = generatedReleaseTag.get().asFile
        output.parentFile.mkdirs()
        output.text = 'cd-v' + versionName + '\n'
        println("Desktop updater release tag: cd-v" + versionName)
    }
}
sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/update-tag'))
tasks.named('processResources') { dependsOn tasks.named('generateDesktopReleaseTag') }
