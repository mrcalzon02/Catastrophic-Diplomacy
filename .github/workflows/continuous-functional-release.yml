name: Release functional game on each commit
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: functional-release-${{ github.sha }}
  cancel-in-progress: false

env:
  CD_RELEASE_TAG: cd-v0.1.5-dev.${{ github.run_number }}
  CD_ANDROID_VERSION_NAME: 0.1.5-dev.${{ github.run_number }}
  CD_ANDROID_BUILD_SEQUENCE: ${{ github.run_number }}
  CD_MSI_APP_VERSION: 0.2.${{ github.run_number }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install deterministic icon exporter
        run: python -m pip install Pillow==11.3.0
      - name: Validate gameplay, 200v200, LAN/PvP, updater and installed Linux application
        run: |
          gradle --no-daemon :core:gameFlowSmoke :core:fighterCraftSmoke \
            :core:massBattleSmoke :core:updaterPolicySmoke \
            :core:desktopUpdaterPolicySmoke :core:shipLineagesSmoke \
            :core:technologySmoke :core:weaponMuzzleSmoke :core:laserFamiliesSmoke :core:propulsionSmoke :core:campaignResearchSmoke \
            :core:campaignTechnologySmoke :core:skirmishTechSmoke :server:check \
            :game:menuFlowSmoke :game:battleTouchSmoke :desktop:installDist
      - name: Create native Linux app image with bundled Java
        run: python3 tools/package_desktop.py
      - name: Verify Linux package and launch executable
        shell: bash
        run: |
          set -euo pipefail
          (cd desktop/build/platform-packages && sha256sum -c Catastrophic-Diplomacy-Linux-x64.zip.sha256)
          python3 - <<'PY'
          import os, pathlib, zipfile
          jars=list(pathlib.Path('desktop/build/install/desktop/lib').glob('desktop-*.jar'))
          assert len(jars)==1
          with zipfile.ZipFile(jars[0]) as jar:
              assert jar.read('cd-update-tag.txt').decode().strip()==os.environ['CD_RELEASE_TAG']
          with zipfile.ZipFile('desktop/build/platform-packages/Catastrophic-Diplomacy-Linux-x64.zip') as archive:
              assert archive.testzip() is None
              assert 'CatastrophicDiplomacy/bin/CatastrophicDiplomacy' in archive.namelist()
          PY
          # Launch the contents of the actual distributable, not an unarchived
          # staging image that could differ from what users download.
          extract_dir="$(mktemp -d)"
          trap 'rm -rf "$extract_dir"' EXIT
          unzip -q desktop/build/platform-packages/Catastrophic-Diplomacy-Linux-x64.zip -d "$extract_dir"
          test -x "$extract_dir/CatastrophicDiplomacy/bin/CatastrophicDiplomacy"
          test -f "$extract_dir/CatastrophicDiplomacy/lib/runtime/release"
          test -s "$extract_dir/CatastrophicDiplomacy/share/icons/hicolor/512x512/apps/catastrophic-diplomacy.png"
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb
          fi
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 1280x800x24' \
            timeout 20s "$extract_dir/CatastrophicDiplomacy/bin/CatastrophicDiplomacy" \
            > linux-launch.log 2>&1
          status=$?
          set -e
          cat linux-launch.log
          if [[ $status -ne 124 ]]; then echo "BLOCKED: Linux game could not launch or exited early ($status)"; exit 1; fi
          echo 'PASS: native Linux game stayed running for 20 seconds'
      - name: Optional artwork and asset diagnostics (not a release gate)
        continue-on-error: true
        run: |
          python3 tools/verify_faction_ship_assets.py
          python3 tools/verify_runtime_ship_art.py --desktop-dir desktop/build/libs
      - uses: actions/upload-artifact@v4
        with:
          name: cd-linux-${{ github.run_id }}
          path: |
            desktop/build/platform-packages/Catastrophic-Diplomacy-Linux-x64.zip
            desktop/build/platform-packages/Catastrophic-Diplomacy-Linux-x64.zip.sha256
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install deterministic icon exporter
        run: python -m pip install Pillow==11.3.0
      - name: Build runnable Windows game and test essential functionality
        shell: pwsh
        run: |
          gradle --no-daemon :core:gameFlowSmoke :core:weaponMuzzleSmoke :core:laserFamiliesSmoke :core:propulsionSmoke :core:desktopUpdaterPolicySmoke :game:menuFlowSmoke :desktop:installDist
          if ($LASTEXITCODE -ne 0) { throw 'Windows game failed gameplay/compile' }
          python tools/package_desktop.py
          python tools/generate_app_icons.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Native MSI packaging failed' }
      - name: Install, launch and uninstall real Windows MSI
        shell: pwsh
        run: ./tools/verify_windows_msi.ps1
      - name: Verify MSI SHA256 and game updater release identity
        shell: pwsh
        run: |
          $dir = 'desktop/build/platform-packages'
          $line = (Get-Content "$dir/Catastrophic-Diplomacy-Windows-x64.msi.sha256").Trim()
          $expected = ($line -split '\s+')[0]
          if ((Get-FileHash "$dir/Catastrophic-Diplomacy-Windows-x64.msi" -Algorithm SHA256).Hash -ine $expected) { throw 'MSI digest mismatch' }
          Add-Type -AssemblyName System.IO.Compression
          $jar = Get-ChildItem desktop/build/install/desktop/lib -Filter 'desktop-*.jar' | Select-Object -First 1
          if ($null -eq $jar) { throw 'Desktop JAR absent' }
          $archive = [System.IO.Compression.ZipFile]::OpenRead($jar.FullName)
          try {
            $entry = $archive.GetEntry('cd-update-tag.txt')
            if ($null -eq $entry) { throw 'Missing updater identity' }
            $reader = [System.IO.StreamReader]::new($entry.Open())
            try { $tag = $reader.ReadToEnd().Trim() } finally { $reader.Dispose() }
            if ($tag -ne $env:CD_RELEASE_TAG) { throw "Updater tag mismatch: $tag" }
          } finally { $archive.Dispose() }
      - uses: actions/upload-artifact@v4
        with:
          name: cd-windows-${{ github.run_id }}
          path: |
            desktop/build/platform-packages/Catastrophic-Diplomacy-Windows-x64.msi
            desktop/build/platform-packages/Catastrophic-Diplomacy-Windows-x64.msi.sha256
          if-no-files-found: error

  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CD_ANDROID_KEYSTORE_BASE64: ${{ secrets.CD_ANDROID_KEYSTORE_BASE64 }}
      CD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CD_ANDROID_KEYSTORE_PASSWORD }}
      CD_ANDROID_KEY_ALIAS: ${{ secrets.CD_ANDROID_KEY_ALIAS }}
      CD_ANDROID_KEY_PASSWORD: ${{ secrets.CD_ANDROID_KEY_PASSWORD }}
      CD_ANDROID_KEYSTORE_PATH: .local-secrets/android-release.p12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install deterministic icon exporter
        run: python -m pip install Pillow==11.3.0
      - name: Restore retained signing certificate, build debug and signed release
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_android_api26_compat.py
          python3 tools/test_prepare_android_update_manifest.py
          test -n "$CD_ANDROID_KEYSTORE_BASE64" && test -n "$CD_ANDROID_KEYSTORE_PASSWORD"
          test -n "$CD_ANDROID_KEY_PASSWORD" && test "$CD_ANDROID_KEY_ALIAS" = 'catastrophic-diplomacy'
          umask 077
          mkdir -p .local-secrets
          printf '%s' "$CD_ANDROID_KEYSTORE_BASE64" | base64 --decode > .local-secrets/android-release.p12
          test -s .local-secrets/android-release.p12
          manager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          "$manager" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;35.0.0'
          python tools/generate_app_icons.py
          python tools/generate_app_icons.py --check
          gradle --no-daemon :android:assembleDebug :android:assembleRelease
      - name: Verify signed Android APK and updater manifest
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          mkdir -p package
          cp android/build/outputs/apk/release/android-release.apk package/Catastrophic-Diplomacy-Android.apk
          cp android/build/outputs/apk/debug/android-debug.apk package/verify-debug.apk
          apksigner verify --verbose --print-certs package/Catastrophic-Diplomacy-Android.apk > package/signature-verification.txt
          aapt dump badging package/Catastrophic-Diplomacy-Android.apk | grep '^package:' > package/package-identity.txt
          aapt dump resources package/Catastrophic-Diplomacy-Android.apk | grep -q 'ic_launcher'
          python tools/generate_app_icons.py --check
          grep -F "name='games.catastrophicdiplomacy' versionCode='$((1000+CD_ANDROID_BUILD_SEQUENCE))' versionName='$CD_ANDROID_VERSION_NAME'" package/package-identity.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' package/signature-verification.txt
          python3 tools/prepare_android_update_manifest.py package/Catastrophic-Diplomacy-Android.apk --output package/release-manifest.json
          (cd package && sha256sum Catastrophic-Diplomacy-Android.apk > SHA256SUMS.txt)
      - name: Optional Fire tablet sideload compatibility diagnostic
        continue-on-error: true
        run: |
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          python3 tools/verify_fire_tablet_target.py --apk package/Catastrophic-Diplomacy-Android.apk
      - name: Erase transient signing key
        if: always()
        run: rm -rf .local-secrets
      - uses: actions/upload-artifact@v4
        with:
          name: cd-android-${{ github.run_id }}
          path: package/
          if-no-files-found: error

  android-runtime:
    needs: android-build
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/download-artifact@v4
        with: {name: 'cd-android-${{ github.run_id }}', path: package}
      - name: Require accelerated Android emulator
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none
          script: |
            bash tools/android_verify_demo.sh package/verify-debug.apk test-output/android
            # Save genuine in-engine approved hull sprites at four seeded physics
            # integrity states. Cosmetic evidence must NOT block a functional release.
            bash tools/android_capture_surface_damage.sh test-output/android || echo "WARNING: optional real hull-damage screenshot diagnostic unavailable"
            # Gate the real Android release dialog: UPDATE must be an actionable
            # button, not a hidden list masked by an explanatory message.
            bash tools/android_verify_update_dialog.sh test-output/android
            adb uninstall games.catastrophicdiplomacy
            adb install package/Catastrophic-Diplomacy-Android.apk
            adb shell am start -W -n games.catastrophicdiplomacy/diplomacy.android.AndroidLauncher
            sleep 5
            adb shell pidof games.catastrophicdiplomacy
            bash tools/android_verify_menu.sh test-output/android
      - name: Preserve emulator evidence including game screenshots and telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cd-android-functional-${{ github.run_id }}
          path: test-output/android/
          if-no-files-found: warn

  # User-visible campaign launch is functional, not an optional screenshot
  # diagnostic. Android 14/API34 alone cannot detect Java 16 Stream.toList
  # crashes on Galaxy S9/Android 10 and other supported older devices.
  android-campaign-runtime:
    needs: android-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Every faction remains release-blocking, but no single emulator runs
    # through eleven unrelated cold starts while accumulating driver state.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {first: 0, last: 3}
          - {first: 4, last: 7}
          - {first: 8, last: 10}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/download-artifact@v4
        with: {name: 'cd-android-${{ github.run_id }}', path: package}
      - name: Require accelerated Android 10 emulator
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none
          script: |
            adb install package/Catastrophic-Diplomacy-Android.apk
            bash tools/android_verify_campaign.sh test-output/campaign-api29 ${{ matrix.first }} ${{ matrix.last }}
      - name: Preserve campaign crash logs and real map/dock/deployment/combat screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cd-android-campaign-api29-${{ github.run_id }}-${{ matrix.first }}-${{ matrix.last }}
          path: test-output/campaign-api29/
          if-no-files-found: warn

  publish:
    needs: [linux, windows, android-runtime, android-campaign-runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: 'cd-linux-${{ github.run_id }}', path: dist}
      - uses: actions/download-artifact@v4
        with: {name: 'cd-windows-${{ github.run_id }}', path: dist}
      - uses: actions/download-artifact@v4
        with: {name: 'cd-android-${{ github.run_id }}', path: dist}
      - name: Publish only after full functionality checks and checksum verification
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c Catastrophic-Diplomacy-Linux-x64.zip.sha256
          sha256sum -c Catastrophic-Diplomacy-Windows-x64.msi.sha256
          sha256sum -c SHA256SUMS.txt
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          m=json.loads(Path('release-manifest.json').read_text())
          assert m['version']==os.environ['CD_ANDROID_VERSION_NAME']
          assert m['versionCode']==1000+int(os.environ['CD_ANDROID_BUILD_SEQUENCE'])
          assert m['apk']['name']=='Catastrophic-Diplomacy-Android.apk'
          for name in ('Catastrophic-Diplomacy-Windows-x64.msi',
                       'Catastrophic-Diplomacy-Linux-x64.zip',
                       'Catastrophic-Diplomacy-Android.apk'):
              assert Path(name).stat().st_size>1000000, name
          PY
          if gh release view "$CD_RELEASE_TAG" -R "$GH_REPO" >/dev/null 2>&1; then
            echo 'BLOCKED: this tag was already published; no asset overwrite'
            exit 1
          fi
          sha256sum Catastrophic-Diplomacy-Android.apk Catastrophic-Diplomacy-Windows-x64.msi Catastrophic-Diplomacy-Linux-x64.zip > FULL-SHA256SUMS.txt
          cat > notes.md <<EOF
          Catastrophic Diplomacy functional prerelease, source commit $GITHUB_SHA.
          Windows: actual MSI (install, launch, uninstall tested). Linux: bundled-Java app (launched under virtual display).
          Android: retained-signer APK (emulator combat and game menu navigation verified).
          Art, balance, audio quality and design are diagnostic only. Physical-device verification not claimed.
          EOF
          gh release create "$CD_RELEASE_TAG" -R "$GH_REPO" --target "$GITHUB_SHA" \
            --title "Catastrophic Diplomacy $CD_ANDROID_VERSION_NAME — Windows Linux Android" \
            --prerelease --notes-file notes.md \
            Catastrophic-Diplomacy-Windows-x64.msi Catastrophic-Diplomacy-Linux-x64.zip \
            Catastrophic-Diplomacy-Android.apk release-manifest.json package-identity.txt \
            signature-verification.txt FULL-SHA256SUMS.txt
          # Read back the published release and require exactly this source's
          # public three-platform package set. A successful upload command
          # alone is not an independently verified publication.
          gh release view "$CD_RELEASE_TAG" -R "$GH_REPO" \
            --json tagName,targetCommitish,isDraft,isPrerelease,assets \
            | jq -e --arg tag "$CD_RELEASE_TAG" --arg sha "$GITHUB_SHA" '
              .tagName==$tag and .targetCommitish==$sha and
              .isDraft==false and .isPrerelease==true and
              ([.assets[].name] |
                index("Catastrophic-Diplomacy-Windows-x64.msi")!=null and
                index("Catastrophic-Diplomacy-Linux-x64.zip")!=null and
                index("Catastrophic-Diplomacy-Android.apk")!=null)'
          echo 'PASS: exact game commit and all three public release assets independently read back'
