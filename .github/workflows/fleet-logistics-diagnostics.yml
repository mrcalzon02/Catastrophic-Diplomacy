name: Four-channel fleet logistics diagnostic

# On-demand diagnostic: temporarily retired from automatic main-push CI.
# Its commands, seed matrix, test assertions and artifacts remain intact.
on:
  workflow_dispatch:

permissions:
  contents: read

# Standalone functional proof. Supersede outdated push revisions, but keep
# manual runs independent; cosmetic diagnostics never gate publication.
# Latest push wins for this diagnostic. An explicit manual run has a
# unique concurrency group and never cancels either another manual run
# or a release. No current balance/style diagnostic blocks publication.
concurrency:
  group: cd-diagnostic-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  service-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test real powered projectors, auras, drone return and 200v200
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-output/fleet-logistics
          gradle --no-daemon :core:fleetLogisticsSmoke :core:supportSystemsSmoke :core:demoSupportSmoke |
            tee test-output/fleet-logistics/functional.log
      - name: Preserve evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-logistics-proof-${{ github.sha }}
          path: test-output/fleet-logistics/
          retention-days: 30
          if-no-files-found: warn
