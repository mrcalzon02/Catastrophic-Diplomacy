name: Optional fleet tender logistics diagnostic
# On-demand diagnostic: temporarily retired from automatic main-push CI.
# Its commands, seed matrix, test assertions and artifacts remain intact.
on:
  workflow_dispatch:

permissions:
  contents: read
# Latest push wins for this diagnostic. An explicit manual run has a
# unique concurrency group and never cancels either another manual run
# or a release. No current balance/style diagnostic blocks publication.
concurrency:
  group: cd-diagnostic-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  physical-stores:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Verify finite ammunition and fuel transfer, fitted upgrades and conservation
        run: gradle --no-daemon :core:fleetTenderSmoke :core:technologySmoke
