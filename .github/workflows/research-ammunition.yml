name: Research-gated physical ammunition and salvos
on:
  push:
    branches: ['feature/research-locked-ammunition-20261025', 'feature/save-selectable-research-ammo-20261025']
  pull_request:
    paths:
      - 'core/src/main/java/diplomacy/sim/AmmunitionResearch.java'
      - 'core/src/main/java/diplomacy/sim/AmmunitionTable.java'
      - 'core/src/main/java/diplomacy/sim/Battle.java'
      - 'core/src/main/java/diplomacy/shipyard/Shipyard.java'
      - 'core/src/test/java/diplomacy/sim/AmmunitionResearchTest.java'
      - 'core/build.gradle'
      - '.github/workflows/research-ammunition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify 11-faction research-gated ammo, physical payload effects and 200v200 replay
        run: |
          gradle --no-daemon --stacktrace \
            :core:ammunitionResearchSmoke :core:ammunitionSelectionSmoke :core:ammunitionTypesSmoke \
            :core:ordnanceDoctrineSmoke :core:moduleResearchSmoke \
            :core:crewAccommodationSmoke :core:massBattleCampaign \
            :game:classes :desktop:classes
