name: Build and publish actual Windows MSI for 0.1.5 RC1

# Historical 0.1.5 RC1 installer recovery only. Its direct MSI asset is already
# published; the ongoing per-commit release owns current Windows packaging.
# Never trigger this fixed-tag publisher on an unrelated main commit.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cd-windows-msi-rc1
  cancel-in-progress: false

jobs:
  installer:
    name: Build MSI from exact released game source and install/uninstall test
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - name: Checkout the already-qualified RC1 source, not changing main
        uses: actions/checkout@v4
        with:
          ref: cd-v0.1.5-rc.1
      - name: Checkout the independently committed MSI packaging repair
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: msi-tools
      - name: Install the MSI packager and verification script without modifying game source
        shell: pwsh
        run: |
          Copy-Item msi-tools/tools/package_desktop.py tools/package_desktop.py -Force
          Copy-Item msi-tools/tools/verify_windows_msi.ps1 tools/verify_windows_msi.ps1 -Force
          Remove-Item msi-tools -Recurse -Force
          git status --short
          if ((git diff --name-only -- core game android desktop assets asset_packs build.gradle).Length -ne 0) {
            throw 'Game sources changed while installing the MSI-only tooling'
          }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-run original release game tests and prepare real app payload
        shell: pwsh
        run: |
          gradle :core:fighterCraftSmoke :core:combatMachinerySmoke :core:gameFlowSmoke :game:menuFlowSmoke :game:classes :desktop:installDist --no-daemon --stacktrace
          if ($LASTEXITCODE -ne 0) { throw 'Released source gameplay tests or desktop installDist failed' }
          python tools/verify_tactical_ui.py
          if ($LASTEXITCODE -ne 0) { throw 'Original UI asset validation failed' }
          python tools/verify_tactical_ui_packages.py --desktop-dir desktop/build/libs
          if ($LASTEXITCODE -ne 0) { throw 'Original desktop asset package invalid' }
      - name: Build real Windows Installer with jpackage and WiX
        shell: pwsh
        run: |
          python tools/package_desktop.py
          if ($LASTEXITCODE -ne 0) { throw 'MSI build failed; no ZIP fallback allowed' }
      - name: Silent install and uninstall the actual MSI
        shell: pwsh
        run: ./tools/verify_windows_msi.ps1
      - name: Upload checked MSI to next publication job
        uses: actions/upload-artifact@v4
        with:
          name: cd-direct-msi-rc1
          path: |
            desktop/build/platform-packages/Catastrophic-Diplomacy-Windows-x64.msi
            desktop/build/platform-packages/Catastrophic-Diplomacy-Windows-x64.msi.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Attach direct MSI file to published RC1 without replacing game builds
    needs: installer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GAME_SOURCE: 72afaa8fad431a9b37ac6fcc40d9ae2a7bd41b99
      TOOL_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cd-direct-msi-rc1
          path: dist
      - name: Verify MSI identity and direct-download checksum
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c Catastrophic-Diplomacy-Windows-x64.msi.sha256)
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          path=Path('dist/Catastrophic-Diplomacy-Windows-x64.msi')
          with path.open('rb') as f:
              assert f.read(8)==bytes.fromhex('d0cf11e0a1b11ae1')
          assert not zipfile.is_zipfile(path)
          assert path.stat().st_size>1_000_000
          print('PASS: actual standalone MSI with non-ZIP Windows Installer format')
          PY
      - name: Verify original prerelease tag and record installer-only provenance
        shell: bash
        run: |
          set -euo pipefail
          tag=cd-v0.1.5-rc.1
          gh release view "$tag" --repo "$GH_REPO" --json isDraft,isPrerelease,targetCommitish |
            jq -e --arg sha "$GAME_SOURCE" '
              .isDraft==false and .isPrerelease==true and .targetCommitish==$sha'
          if gh release view "$tag" --repo "$GH_REPO" --json assets --jq '.assets[].name' |
              grep -Fxq 'Catastrophic-Diplomacy-Windows-x64.msi'; then
            echo 'BLOCKED: MSI already published. Never clobber released assets.'
            exit 1
          fi
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          path=Path('dist/Catastrophic-Diplomacy-Windows-x64.msi')
          with path.open('rb') as f:
            digest=hashlib.file_digest(f,'sha256').hexdigest()
          proof={
            'schema':'cd-windows-msi-v1',
            'released_game_source':os.environ['GAME_SOURCE'],
            'installer_only_tool_revision':os.environ['TOOL_COMMIT'],
            'windows_test_and_msi_install_run':os.environ['GITHUB_RUN_ID'],
            'file':path.name,'size_bytes':path.stat().st_size,
            'sha256':digest,'authenticode_signed':False,
            'bundled_java_17':True,'windows_installer_upgrade_uuid':'cfc2e09f-fbaa-4b95-9f20-d59ac1148057'
          }
          Path('dist/Windows-MSI-provenance.json').write_text(
             json.dumps(proof,sort_keys=True,indent=2)+'\n')
          PY
      - name: Upload MSI as a direct release asset and read back
        shell: bash
        run: |
          set -euo pipefail
          tag=cd-v0.1.5-rc.1
          gh release upload "$tag" -R "$GH_REPO" \
            dist/Catastrophic-Diplomacy-Windows-x64.msi \
            dist/Catastrophic-Diplomacy-Windows-x64.msi.sha256 \
            dist/Windows-MSI-provenance.json
          gh release view "$tag" -R "$GH_REPO" --json assets \
            --jq '.assets[] | select(.name=="Catastrophic-Diplomacy-Windows-x64.msi") | {name,size,downloadCount}'
          printf '%s\n' 'PASS: MSI attached as direct GitHub Release asset, with no nested ZIP'
