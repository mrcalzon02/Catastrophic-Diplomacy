# Mechanics accuracy and presentation comparison for 2x physical ship motion.
# The functional thrust/fuel parity gate is required here; render aesthetics
# remain advisory, and this workflow does not package or publish releases.
name: Doubled position fidelity checks
on:
  workflow_dispatch:
concurrency:
  group: cd-position-fidelity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  physical-position-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Required physical thrust, fuel and motion integrity
        run: gradle --no-daemon :core:worldScaleAndPropulsionSmoke
      - name: Advisory same-run 200v200 ship-integration cost A/B
        continue-on-error: true
        run: gradle --no-daemon :core:positionSubstepAB
      - name: Advisory six-speed 15/30/60 FPS presentation diagnostic
        id: presentation
        continue-on-error: true
        run: gradle --no-daemon :game:renderPosesSmoke :game:combatTimelineDiagnostic
      - name: Preserve per-frame motion measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cd-position-fidelity-${{ github.run_id }}
          path: |
            test-output/combat-timeline/
            test-output/position-fidelity/
          if-no-files-found: warn
      - name: Report advisory presentation results
        if: always()
        env:
          OUTCOME: ${{ steps.presentation.outcome }}
        run: |
          if [ "$OUTCOME" != "success" ]; then
            echo "::warning::Nonblocking presentation diagnostic failed; inspect the logs"
          else
            echo "PASS: scripted six-speed presentation continuity"
          fi
