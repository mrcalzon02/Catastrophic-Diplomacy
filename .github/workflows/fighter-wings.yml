name: Fighter wings combat and multiplatform smoke
on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'game/**'
      - 'android/**'
      - 'desktop/**'
      - 'tools/package_desktop.py'
      - 'assets/ui/tactical/selected_manifest.json'
      - 'asset_packs/ui-kit/**'
      - 'build.gradle'
      - 'tools/verify_tactical_ui.py'
      - 'tools/verify_tactical_ui_packages.py'
      - 'tools/test_verify_tactical_ui_packages.py'
      - '.github/workflows/fighter-wings.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'game/**'
      - 'android/**'
      - 'desktop/**'
      - 'tools/package_desktop.py'
      - 'assets/ui/tactical/selected_manifest.json'
      - 'asset_packs/ui-kit/**'
      - 'build.gradle'
      - 'tools/verify_tactical_ui.py'
      - 'tools/verify_tactical_ui_packages.py'
      - 'tools/test_verify_tactical_ui_packages.py'
      - '.github/workflows/fighter-wings.yml'
concurrency:
  group: fighter-wings-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  desktop-core:
    name: Craft/saves/weapon tests + desktop compile (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test fighter machinery, menu navigation and compile installed desktop application
        run: gradle :core:fighterCraftSmoke :core:combatMachinerySmoke :core:gameFlowSmoke :game:menuFlowSmoke :game:classes :desktop:installDist --no-daemon --stacktrace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact 24 source-approved icons in built desktop JAR
        run: |
          python tools/verify_tactical_ui.py
          python tools/test_verify_tactical_ui_packages.py
          python tools/verify_tactical_ui_packages.py --desktop-dir desktop/build/libs
      - name: Package actual Windows/Linux executable and bundled Java 17 runtime
        run: python tools/package_desktop.py
      - name: Upload runnable desktop package and checksums
        uses: actions/upload-artifact@v4
        with:
          name: cd-desktop-${{ matrix.os }}-${{ github.sha }}
          path: |
            desktop/build/platform-packages/*.zip
            desktop/build/platform-packages/*.sha256
          if-no-files-found: error
          retention-days: 30

  mass-battle:
    name: Mixed 200v200 every fighter weapon and replay
    needs: desktop-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Exercise 1v1 through 200v200 and repeat mixed 400-ship carrier battle
        run: gradle :core:massBattleSmoke --no-daemon --stacktrace

  android-build:
    name: Package shared fighter code in debug APK
    needs: desktop-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android platform and build tools
        run: ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build Android package from same core and game
        run: gradle :android:assembleDebug --no-daemon --stacktrace
      - name: Verify exact 24 source-approved icons in built Android APK
        run: python3 tools/verify_tactical_ui_packages.py --android-apk android/build/outputs/apk/debug/android-debug.apk
