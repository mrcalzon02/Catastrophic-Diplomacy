name: Pull request functional checks
on:
  pull_request:
    paths:
      - 'core/**'
      - 'game/**'
      - 'server/**'
      - 'desktop/**'
      - 'android/**'
      - 'assets/**'
      - 'asset_packs/**'
      - 'tools/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/fighter-wings.yml'
      - '.github/workflows/continuous-functional-release.yml'

permissions:
  contents: read

# PR verification must not duplicate the signed three-platform release.
# Superseded PR revisions can be cancelled; main-commit releases cannot.
concurrency:
  group: cd-pr-functional-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  desktop-and-server:
    name: Compile desktop and test gameplay/network (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Validate actual gameplay, LAN/PvP, update selection and desktop assembly
        run: |
          gradle --no-daemon :core:gameFlowSmoke :core:fighterCraftSmoke :core:updaterPolicySmoke :core:desktopUpdaterPolicySmoke :server:check :game:menuFlowSmoke :desktop:installDist
      - name: Run full 200v200 combat replay (one runner)
        if: runner.os == 'Linux'
        run: gradle --no-daemon :core:massBattleSmoke

  android-compile:
    name: Build installable Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Validate updater manifest support
        run: python3 tools/test_prepare_android_update_manifest.py
      - name: Build installable APK (no signing secrets on pull requests)
        run: gradle --no-daemon :android:assembleDebug
      - name: Verify APK exists
        run: test -s android/build/outputs/apk/debug/android-debug.apk

  art-diagnostics:
    name: Non-blocking asset inventory and faction sprite diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Inspect art and UI manifests (informational, never a release gate)
        run: |
          python3 tools/verify_faction_ship_assets.py
          python3 tools/verify_tactical_ui.py
