name: Optional point-defense threat balance diagnostics
on:
  push:
    branches: [main]
    paths:
      - 'core/src/main/java/diplomacy/sim/RocketBarrage.java'
      - 'core/src/main/java/diplomacy/sim/Battle.java'
      - 'core/src/main/java/diplomacy/sim/ProjectileModel.java'
      - 'core/src/main/java/diplomacy/sim/WeaponBehaviorTable.java'
      - 'core/src/main/java/diplomacy/shipyard/Shipyard.java'
      - 'core/src/test/java/diplomacy/sim/RocketPdBalanceDiagnostic.java'
      - 'core/src/test/java/diplomacy/sim/PointDefenseThreatMatrixDiagnostic.java'
      - 'core/src/test/java/diplomacy/sim/PointDefenseLoadDiagnostic.java'
      - 'core/src/main/java/diplomacy/sim/OrdnanceDoctrine.java'
      - 'core/src/main/java/diplomacy/sim/AmmunitionTable.java'
      - 'core/src/test/java/diplomacy/sim/AmmunitionTableTest.java'
      - 'core/src/test/java/diplomacy/sim/OrdnanceDoctrineTest.java'
      - 'core/src/main/java/diplomacy/sim/OrdnanceSubmunitions.java'
      - 'core/src/main/java/diplomacy/sim/FighterModel.java'
      - 'core/src/main/java/diplomacy/sim/RocketPdSaturation.java'
      - 'core/build.gradle'
      - '.github/workflows/rocket-pd-balance-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
# Latest push wins for this diagnostic. An explicit manual run has a
# unique concurrency group and never cancels either another manual run
# or a release. No current balance/style diagnostic blocks publication.
concurrency:
  group: cd-diagnostic-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  measured-rocket-pd-ladder:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Test real matched-rank weapon and defense pairs
        id: ladder
        continue-on-error: true
        run: gradle --no-daemon :core:rocketPdBalanceDiagnostic
      - name: Verify real AP missile and micro-swarm salvo launches
        id: ap_micro
        run: gradle --no-daemon :core:pdGuidedLaunchSmoke
      - name: Test every other physically interceptable threat against researched PD
        id: matrix
        continue-on-error: true
        run: gradle --no-daemon :core:pdThreatMatrixDiagnostic
      - name: Measure incidental, surge and sustained physical PD load
        id: load
        continue-on-error: true
        run: gradle --no-daemon :core:pdLoadProfileDiagnostic
      - name: Compare existing physical laser PD versus flak (focused P0)
        id: family_p0
        continue-on-error: true
        run: gradle --no-daemon :core:pdFamilyP0Diagnostic
      - name: Surface sample metrics and diagnostic outcome
        if: always()
        run: |
          echo "## Existing PD versus FLK (physical P0)" >> "$GITHUB_STEP_SUMMARY"
          echo "Focused family diagnostic: ${{ steps.family_p0.outcome }} (advisory only)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f core/test-output/pd-family-p0/summary.md ]; then
            cat core/test-output/pd-family-p0/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No P0 metrics produced. Inspect the testClasses JavaExec logs." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "## All physically interceptable threats versus point defense" >> "$GITHUB_STEP_SUMMARY"
          echo "AP missile and micro-swarm functional launches: ${{ steps.ap_micro.outcome }} (required)" >> "$GITHUB_STEP_SUMMARY"
          echo "Other threats: ${{ steps.matrix.outcome }} (advisory only)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f core/test-output/pd-interception-matrix/summary.md ]; then
            cat core/test-output/pd-interception-matrix/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No all-threat metrics produced. Inspect the advisory matrix job logs." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "## Incidental, surge and sustained PD load" >> "$GITHUB_STEP_SUMMARY"
          echo "Load diagnostic: ${{ steps.load.outcome }} (advisory only)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f core/test-output/pd-load-profiles/summary.md ]; then
            cat core/test-output/pd-load-profiles/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Load diagnostic produced no metrics; see advisory run logs." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "## Rocket versus point defense" >> "$GITHUB_STEP_SUMMARY"
          echo "Diagnostic execution: ${{ steps.ladder.outcome }} (advisory only)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f core/test-output/rocket-pd-balance/summary.md ]; then
            cat core/test-output/rocket-pd-balance/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No metrics produced. Inspect the diagnostic's execution logs for the failure." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve machine-readable results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-point-defense-interception-matrix
          path: |
            core/test-output/rocket-pd-balance/
            core/test-output/pd-interception-matrix/
            core/test-output/pd-load-profiles/
            core/test-output/pd-family-p0/
          if-no-files-found: warn
          retention-days: 30
