name: Clear Actions artifact store
on:
  push:
    branches: [main]
    paths: [".github/workflows/one-shot-clear-actions-artifacts.yml"]
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 19 25 11 *'
permissions:
  actions: write
concurrency:
  group: one-shot-clear-actions-artifact-store
  cancel-in-progress: false
jobs:
  clear:
    if: >-
      github.repository == 'mrcalzon02/Catastrophic-Diplomacy' && (github.event_name == 'schedule' || github.event.head_commit.message == 'chore(ci): clear the repository Actions artifact store')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Enumerate and delete all Actions artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(date -u +%F)" == "2026-11-25" ]] || exit 0
          python3 - <<'PY'
          import concurrent.futures, json, os, time, urllib.error, urllib.request
          assert os.environ['GITHUB_REPOSITORY'] == 'mrcalzon02/Catastrophic-Diplomacy'
          base = 'https://api.github.com/repos/mrcalzon02/Catastrophic-Diplomacy/actions/artifacts'
          headers = {'Authorization': 'Bearer '+os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json',
                     'X-GitHub-Api-Version': '2022-11-28',
                     'User-Agent': 'owner-authorized-actions-artifact-cleanup'}
          def request(url, method='GET'):
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=headers, method=method), timeout=25) as reply:
                          return reply.read(), reply.headers
                  except urllib.error.HTTPError as exc:
                      if method=='DELETE' and exc.code==404:
                          return None, {}
                      if attempt==2 or exc.code not in (429, 500, 502, 503, 504):
                          raise
                      delay=exc.headers.get('Retry-After','')
                      time.sleep(min(int(delay),30) if delay.isdecimal() else 2**attempt)
              raise RuntimeError('unreachable')
          def inventory():
              rows={}
              for page in range(1,301):
                  raw, meta=request(base+'?per_page=100&page='+str(page))
                  page_data=json.loads(raw)
                  for entry in page_data['artifacts']:
                      aid=entry['id']
                      if type(aid) is not int or aid<=0:
                          raise ValueError('Invalid artifact identifier')
                      rows[aid]=entry.get('size_in_bytes') or 0
                  if 'rel="next"' not in meta.get('Link',''):
                      return rows
              raise RuntimeError('Artifact inventory exceeds explicit page bound; no partial inventory used')
          def delete(entry):
              aid,n=entry
              raw,_=request(base+'/'+str(aid),'DELETE')
              return (1,n) if raw is not None else (0,0)
          count=bytes_deleted=0
          for sweep in range(3):
              rows=inventory()
              print('ARTIFACT_INVENTORY '+json.dumps({'sweep':sweep,'count':len(rows),'bytes':sum(rows.values())}),flush=True)
              if not rows: break
              with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
                  for added,size in pool.map(delete,rows.items()):
                      count+=added; bytes_deleted+=size
              print('ARTIFACT_DELETE_PROGRESS '+json.dumps({'deleted':count,'bytes':bytes_deleted}),flush=True)
          remaining=len(inventory())
          print('ARTIFACT_PURGE_RESULT '+json.dumps({'deleted':count,'bytes':bytes_deleted,'remaining':remaining}),flush=True)
          if remaining: raise SystemExit('Some artifacts remain')
          PY
