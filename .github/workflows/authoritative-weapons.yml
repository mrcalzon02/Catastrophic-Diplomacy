name: Authoritative weapon behavior tables and 200v200 regression
on:
  push:
    branches: ['feature/authoritative-weapon-behavior-tables-20261025']
  pull_request:
    paths:
      - 'core/src/**'
      - 'core/build.gradle'
      - '.github/workflows/authoritative-weapons.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mechanics:
    name: Full artillery, ordnance, defense and fleet acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify authoritative main guns, defensive impact rules, PD and 66 fighter profiles
        run: |
          gradle --no-daemon --stacktrace \
            :core:weaponBehaviorSmoke :core:projectileModuleSmoke \
            :core:weaponFxSmoke :core:fighterCraftSmoke \
            :core:moduleResearchSmoke :core:moduleVersionsSmoke \
            :core:crewAccommodationSmoke :core:supportSystemsSmoke \
            :core:massBattleCampaign :game:classes :desktop:classes
