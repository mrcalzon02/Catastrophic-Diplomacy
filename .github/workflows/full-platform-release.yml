name: Assemble verified full-platform prerelease

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-platform-release.yml'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact already-tested game commit; blank uses workflow HEAD
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: cd-full-platform-release
  cancel-in-progress: false

jobs:
  release:
    name: Assemble and publish four-platform release after mandatory qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select tested source without substituting unverified application code
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Workflow-only repair commits must not impersonate new game builds.
            # Walk back through ONLY this workflow's revisions to the latest
            # actual application commit and demand its exact Actions evidence.
            source="$GITHUB_SHA"
            while [[ "$(git diff-tree --no-commit-id --name-only -r "$source")" == '.github/workflows/full-platform-release.yml' ]]; do
              source="$(git rev-parse "$source^")"
            done
          else
            source="${{ inputs.source_sha }}"
            if [[ -z "$source" ]]; then source="$GITHUB_SHA"; fi
          fi
          [[ "$source" =~ ^[a-f0-9]{40}$ ]] || { echo 'Invalid exact source SHA'; exit 1; }
          git cat-file -e "$source^{commit}"
          git merge-base --is-ancestor "$source" "$GITHUB_SHA" || {
            echo 'BLOCKED: source commit is not on authoritative main'; exit 1;
          }
          echo "SOURCE_SHA=$source" >> "$GITHUB_ENV"
          echo "Release source: $source; never rebuild or substitute binaries after testing"

      - name: Wait for exact-commit Windows Linux Android Fire and live emulator gates
        shell: bash
        run: |
          set -euo pipefail
          describe_run() {
            local requested="$1"
            gh api -X GET "repos/$GH_REPO/actions/runs" -f "head_sha=$SOURCE_SHA" -f per_page=100 |
              jq -r --arg name "$requested" --arg sha "$SOURCE_SHA" '
                [.workflow_runs[] | select(.name==$name and .head_sha==$sha)] |
                sort_by(.created_at, .run_attempt) | last |
                if .==null then "missing|missing|missing"
                else "\(.id)|\(.status)|\(.conclusion // "pending")" end'
          }
          for attempt in $(seq 1 110); do
            smoke="$(describe_run 'Fighter wings combat and multiplatform smoke')"
            signed="$(describe_run 'Signed Android 200v200 release candidate')"
            IFS='|' read -r smoke_id smoke_state smoke_result <<< "$smoke"
            IFS='|' read -r signed_id signed_state signed_result <<< "$signed"
            echo "Attempt $attempt: smoke=$smoke; signed/emulator=$signed"
            if [[ "$smoke_state" == completed && "$smoke_result" != success ]] ||
               [[ "$signed_state" == completed && "$signed_result" != success ]]; then
              echo 'BLOCKED: a mandatory actual test failed; no release will be published'
              exit 1
            fi
            if [[ "$smoke_state" == completed && "$smoke_result" == success &&
                  "$signed_state" == completed && "$signed_result" == success ]]; then
              echo "SMOKE_RUN=$smoke_id" >> "$GITHUB_ENV"
              echo "SIGNED_RUN=$signed_id" >> "$GITHUB_ENV"
              echo 'PASS: exactly matching source has both complete, successful test workflows'
              exit 0
            fi
            sleep 30
          done
          echo 'BLOCKED: full qualification did not finish; do not publish'
          exit 1

      - name: Download unchanged release artifacts from verified source SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/windows dist/linux dist/android dist/fireos dist/evidence
          gh run download "$SMOKE_RUN" -R "$GH_REPO" -n "cd-desktop-windows-latest-$SOURCE_SHA" -D dist/windows
          gh run download "$SMOKE_RUN" -R "$GH_REPO" -n "cd-desktop-ubuntu-latest-$SOURCE_SHA" -D dist/linux
          gh run download "$SIGNED_RUN" -R "$GH_REPO" -n "cd-signed-android-0.1.5-rc.1-$SOURCE_SHA" -D dist/android
          gh run download "$SIGNED_RUN" -R "$GH_REPO" -n "cd-fire-tablet-sideload-0.1.5-rc.1-$SOURCE_SHA" -D dist/fireos
          gh run download "$SIGNED_RUN" -R "$GH_REPO" -n "cd-release-functional-evidence-$SOURCE_SHA" -D dist/evidence

      - name: Validate hashes signer results package identity and Fire OS byte parity
        shell: bash
        run: |
          set -euo pipefail
          (cd dist/windows && sha256sum -c Catastrophic-Diplomacy-Windows-x64.zip.sha256)
          (cd dist/linux && sha256sum -c Catastrophic-Diplomacy-Linux-x64.zip.sha256)
          (cd dist/android && sha256sum -c SHA256SUMS.txt)
          (cd dist/fireos && sha256sum -c SHA256SUMS.txt)
          cmp dist/android/Catastrophic-Diplomacy-0.1.5-rc.1-Android.apk dist/fireos/Catastrophic-Diplomacy-0.1.5-rc.1-FireOS.apk
          grep -q "name='games.catastrophicdiplomacy' versionCode='6' versionName='0.1.5-rc.1'" dist/android/package-identity.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' dist/android/signature-verification.txt
          test -s dist/android/release-manifest.json
          test -s dist/evidence/late.png
          test -s dist/evidence/early.png
          test -s dist/evidence/demo-telemetry.txt
          grep -q 'PASS 200v200 mechanics+render-loop' dist/evidence/demo-telemetry.txt
          ! grep -q 'FAIL 200v200' dist/evidence/demo-telemetry.txt
          echo 'PASS: desktop checksums, signed package identity, Fire parity and original emulator evidence'

      - name: Generate combined manifest and audit evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          (cd dist/evidence && zip -q -r ../Catastrophic-Diplomacy-Android-qualification.zip .)
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          base=pathlib.Path('dist')
          names=[
            'windows/Catastrophic-Diplomacy-Windows-x64.zip',
            'linux/Catastrophic-Diplomacy-Linux-x64.zip',
            'android/Catastrophic-Diplomacy-0.1.5-rc.1-Android.apk',
            'fireos/Catastrophic-Diplomacy-0.1.5-rc.1-FireOS.apk',
            'Catastrophic-Diplomacy-Android-qualification.zip'
          ]
          details={}
          for name in names:
            path=base/name
            with path.open('rb') as stream:
              digest=hashlib.file_digest(stream,'sha256').hexdigest()
            details[path.name]={'sha256':digest,'bytes':path.stat().st_size}
          proof={'schema':'cd-full-release-v1','game_commit':os.environ['SOURCE_SHA'],
                 'smoke_run':int(os.environ['SMOKE_RUN']),
                 'android_signed_and_live_run':int(os.environ['SIGNED_RUN']),
                 'platforms':['Windows x64','Linux x64','Android','Fire OS sideload'],
                 'android_apk_pkcs12_signed':True,
                 'windows_authenticode_signed':False,
                 'linux_native_package_signed':False,
                 'hardware_device_accepted':False,
                 'files':details}
          (base/'release-provenance.json').write_text(
              json.dumps(proof,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          with (base/'FULL-SHA256SUMS.txt').open('w',encoding='ascii') as stream:
            for name in names: stream.write(details[(base/name).name]['sha256']+'  '+(base/name).name+'\n')
          print('PASS: combined manifest bound to exact source SHA and successful run IDs')
          PY

      - name: Publish newly qualified four-platform prerelease
        shell: bash
        run: |
          set -euo pipefail
          tag=cd-v0.1.5-rc.1
          if gh release view "$tag" -R "$GH_REPO" >/dev/null 2>&1; then
            echo 'BLOCKED: version tag exists; never replace previously published binaries'
            exit 1
          fi
          cat > dist/full-notes.md <<EOF
          Catastrophic Diplomacy 0.1.5 RC1 — Windows, Linux, Android and Fire OS prerelease.
          Exact built source: $SOURCE_SHA
          Passed desktop/native/200v200 test: https://github.com/$GH_REPO/actions/runs/$SMOKE_RUN
          Passed signed APK + emulator 200v200/menu test: https://github.com/$GH_REPO/actions/runs/$SIGNED_RUN

          Windows and Linux include bundled Java 17. Android and Fire OS contain the
          same retained-signer APK bytes, with Android versionCode 6.
          SHA-256 checksums, release manifest, and qualification evidence are attached.
          Windows is not Authenticode-signed and the Linux ZIP is not signed.
          Physical-device testing, in-place upgrades, and hardware frame-rate
          acceptance are still outstanding. This is not a stable/Play release.
          EOF
          gh release create "$tag" -R "$GH_REPO" --target "$SOURCE_SHA" \
            --title 'Catastrophic Diplomacy 0.1.5 RC1 — Windows Linux Android Fire OS' \
            --prerelease --notes-file dist/full-notes.md \
            dist/windows/Catastrophic-Diplomacy-Windows-x64.zip \
            dist/linux/Catastrophic-Diplomacy-Linux-x64.zip \
            dist/android/Catastrophic-Diplomacy-0.1.5-rc.1-Android.apk \
            dist/android/release-manifest.json \
            dist/android/signature-verification.txt \
            dist/android/package-identity.txt \
            dist/fireos/Catastrophic-Diplomacy-0.1.5-rc.1-FireOS.apk \
            dist/release-provenance.json \
            dist/FULL-SHA256SUMS.txt \
            dist/Catastrophic-Diplomacy-Android-qualification.zip
          gh release view "$tag" -R "$GH_REPO" --json assets,targetCommitish,isPrerelease \
            --jq '{source:.targetCommitish,prerelease:.isPrerelease,assets:[.assets[].name]}'
          echo 'PASS: all four platform packages published from exactly qualified source'
