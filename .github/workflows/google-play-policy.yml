name: Google Play policy and APK-AAB release eligibility
on:
  push:
    branches: [google-play]
  pull_request:
    branches: [google-play]
  workflow_dispatch:

permissions:
  contents: read

# Test-only runs may supersede stale builds; this does not affect release signing.
concurrency:
  group: play-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  google-play-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Verify Play branch contains authoritative main
        id: mainline
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/play-ci"
          python3 scripts/google_play_main_parity.py 2>&1 | tee "$RUNNER_TEMP/play-ci/mainline.log"
      - name: Source and manifest policy tests
        id: source
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/play-ci"
          python3 scripts/play_ci_diagnostics.py --self-test
          python3 scripts/google_play_policy_gate.py source 2>&1 | tee "$RUNNER_TEMP/play-ci/source.log"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Install Android SDK and native build prerequisites
        id: sdk
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 2>&1 | tee "$RUNNER_TEMP/play-ci/sdk.log"
      - name: Create isolated, disposable test-only Play signing certificate
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/play-ci.p12" \
            -storepass 'ci-test-only-never-publish' -keypass 'ci-test-only-never-publish' \
            -alias 'catastrophicdiplomacy-play-upload-v1' -dname 'CN=PLAY CI TEST ONLY,OU=NOT FOR DISTRIBUTION,O=Temporary' \
            -keyalg RSA -keysize 3072 -validity 2 -noprompt
          {
            echo "ORG_GRADLE_PROJECT_playUploadKeystorePath=$RUNNER_TEMP/play-ci.p12"
            echo "ORG_GRADLE_PROJECT_playUploadStorePassword=ci-test-only-never-publish"
            echo "ORG_GRADLE_PROJECT_playUploadKeyAlias=catastrophicdiplomacy-play-upload-v1"
            echo "ORG_GRADLE_PROJECT_playUploadKeyPassword=ci-test-only-never-publish"
          } >> "$GITHUB_ENV"
      - name: Prepare ReverieVR pinned third-party game sources
        id: bootstrap
        continue-on-error: true
        if: false
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/play-ci"
          {
          echo 'Not applicable'
          } 2>&1 | tee "$RUNNER_TEMP/play-ci/bootstrap.log"
      - name: Build Play variant installable APK and Play submission AAB
        id: build
        env:
          ORG_GRADLE_PROJECT_playGamesProjectId: ${{ vars.PLAY_GAMES_PROJECT_ID || '0' }}
        if: steps.sdk.outcome == 'success' && (steps.bootstrap.outcome == 'success' || steps.bootstrap.outcome == 'skipped')
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/play-ci"
                    gradle --no-daemon :android:assemblePlay :android:bundlePlay 2>&1 | tee "$RUNNER_TEMP/play-ci/build.log"
      - name: Verify built Play APK and AAB contents, permissions and signature
        id: artifact
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/google_play_policy_gate.py artifact 2>&1 | tee "$RUNNER_TEMP/play-ci/artifact.log"
      - name: Upload isolated build artifacts for CI inspection, never for store upload
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: PLAY-CI-TEST-ONLY-NOT-FOR-STORE
          path: |
            android/build/outputs/apk/play/*.apk
            android/build/outputs/bundle/play/*.aab
          retention-days: 7
          if-no-files-found: error
      - name: Evaluate policy and Play Console declarations
        id: review
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/play-ci"
          python3 scripts/google_play_policy_gate.py review 2>&1 | tee "$RUNNER_TEMP/play-ci/review.log"
      - name: Verify platform authentication, game account and cloud-save readiness
        id: integration
        if: always()
        continue-on-error: true
        shell: bash
        env:
          PLAY_GAMES_PROJECT_ID: ${{ vars.PLAY_GAMES_PROJECT_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/play-ci"
          python3 scripts/play_games_integration_gate.py 2>&1 | tee "$RUNNER_TEMP/play-ci/integration.log"
      - name: Summarize failure reasons and gate the release
        if: always()
        env:
          PLAY_MAINLINE_OUTCOME: ${{ steps.mainline.outcome }}
          PLAY_SOURCE_OUTCOME: ${{ steps.source.outcome }}
          PLAY_SDK_OUTCOME: ${{ steps.sdk.outcome }}
          PLAY_BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
          PLAY_BUILD_OUTCOME: ${{ steps.build.outcome }}
          PLAY_ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
          PLAY_REVIEW_OUTCOME: ${{ steps.review.outcome }}
          PLAY_INTEGRATION_OUTCOME: ${{ steps.integration.outcome }}
        run: python3 scripts/play_ci_diagnostics.py
      - name: Preserve full release-gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-play-compliance-evidence
          path: ${{ runner.temp }}/play-ci/
          retention-days: 30
          if-no-files-found: error
