name: Signed Android 200v200 release candidate

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/signed-android-rc.yml'
      - 'android/**'
      - 'core/**'
      - 'game/**'
      - 'assets/**'
      - 'tools/android_verify_demo.sh'
      - 'tools/android_verify_menu.sh'
      - 'tools/verify_fire_tablet_target.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cd-signed-android-rc
  cancel-in-progress: true

jobs:
  qualification:
    name: Validate combat and signed-release prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate functional Android navigation scripts
        run: bash -n tools/android_verify_demo.sh tools/android_verify_menu.sh
      - name: Guard Android API 26 campaign ledger file-reading compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("core/src/main/java/diplomacy/sim/CampaignLedger.java").read_text()
          assert "Files.readString(" not in source, "Android API 26-32 lack Files.readString; use readAllBytes"
          assert "Files.readAllBytes(" in source, "Campaign ledger needs Android API 26-compatible reading"
          assert "Files.size(" in source, "Campaign ledger must bound file size before allocation"
          print("PASS: campaign ledger uses Android API 26-compatible bounded file reading")
          PY
      - name: Verify release gate checklist coverage
        run: python3 tools/verify_apk_release_gate.py --checklist-only
      - name: Run updater manifest unit tests
        run: python3 tools/test_prepare_android_update_manifest.py
      - name: Run combined deterministic acceptance with real module research and 200v200 fleet
        run: |
          gradle --no-daemon :core:smoke :core:demoWeaponSmoke :core:massBattleCampaign \
            :core:fighterCraftSmoke :core:projectileModuleSmoke \
            :core:supportSystemsSmoke :core:moduleResearchSmoke \
            :core:updaterPolicySmoke :game:classes :desktop:classes

  signed-android:
    name: Sign Android release APK with retained repository identity
    needs: qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CD_ANDROID_KEYSTORE_BASE64: ${{ secrets.CD_ANDROID_KEYSTORE_BASE64 }}
      CD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CD_ANDROID_KEYSTORE_PASSWORD }}
      CD_ANDROID_KEY_ALIAS: ${{ secrets.CD_ANDROID_KEY_ALIAS }}
      CD_ANDROID_KEY_PASSWORD: ${{ secrets.CD_ANDROID_KEY_PASSWORD }}
      CD_ANDROID_KEYSTORE_PATH: .local-secrets/android-release.p12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Confirm existing signing identity is available (no secret values printed)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CD_ANDROID_KEYSTORE_BASE64" || { echo "BLOCKED: CD_ANDROID_KEYSTORE_BASE64 missing"; exit 1; }
          test -n "$CD_ANDROID_KEYSTORE_PASSWORD" || { echo "BLOCKED: CD_ANDROID_KEYSTORE_PASSWORD missing"; exit 1; }
          test -n "$CD_ANDROID_KEY_ALIAS" || { echo "BLOCKED: CD_ANDROID_KEY_ALIAS missing"; exit 1; }
          test -n "$CD_ANDROID_KEY_PASSWORD" || { echo "BLOCKED: CD_ANDROID_KEY_PASSWORD missing"; exit 1; }
          test "$CD_ANDROID_KEY_ALIAS" = 'catastrophic-diplomacy' || { echo "BLOCKED: unexpected signing alias"; exit 1; }
          umask 077
          mkdir -p .local-secrets
          printf '%s' "$CD_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$CD_ANDROID_KEYSTORE_PATH"
          test -s "$CD_ANDROID_KEYSTORE_PATH"
          echo "PASS: retained signing identity restored from private Actions secrets (no rotation)"
      - name: Install Android SDK 36 for AndroidX
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;35.0.0'
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
      - name: Build PKCS12-signed release variant
        run: gradle --no-daemon --stacktrace :android:assembleRelease
      - name: Verify release signature, package identity and produce manifest
        shell: bash
        run: |
          set -euo pipefail
          source=android/build/outputs/apk/release/android-release.apk
          test -s "$source"
          mkdir -p release
          apk=release/Catastrophic-Diplomacy-0.1.4-rc.1-Android.apk
          cp "$source" "$apk"
          apksigner verify --verbose --print-certs "$apk" | tee release/signature-verification.txt
          aapt dump badging "$apk" | grep '^package:' | tee release/package-identity.txt
          grep -q "name='games.catastrophicdiplomacy' versionCode='5' versionName='0.1.4-rc.1'" release/package-identity.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' release/signature-verification.txt
          python3 tools/prepare_android_update_manifest.py "$apk" --output release/release-manifest.json
          (cd release && sha256sum Catastrophic-Diplomacy-0.1.4-rc.1-Android.apk > SHA256SUMS.txt)
          echo "PASS: signed release artifact verified (identity, APK signature, digest, updater metadata)"
      - name: Verify Amazon Fire tablet sideload compatibility using the actual signed APK
        shell: bash
        run: |
          set -euo pipefail
          apk=release/Catastrophic-Diplomacy-0.1.4-rc.1-Android.apk
          python3 tools/verify_fire_tablet_target.py --apk "$apk"
          mkdir -p fireos
          cp "$apk" fireos/Catastrophic-Diplomacy-0.1.4-rc.1-FireOS.apk
          (cd fireos && sha256sum Catastrophic-Diplomacy-0.1.4-rc.1-FireOS.apk > SHA256SUMS.txt)
          cmp "$apk" fireos/Catastrophic-Diplomacy-0.1.4-rc.1-FireOS.apk
          echo "PASS: Fire OS tablet sideload candidate uses the exact retained Android signer and game build"
      - name: Remove restored private signing identity
        if: always()
        shell: bash
        run: rm -rf .local-secrets
      - name: Upload verified signed release candidate and checksums
        uses: actions/upload-artifact@v4
        with:
          name: cd-signed-android-0.1.4-rc.1-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30
      - name: Upload Amazon Fire tablet compatible signed sideload APK
        uses: actions/upload-artifact@v4
        with:
          name: cd-fire-tablet-sideload-0.1.4-rc.1-${{ github.sha }}
          path: fireos/
          if-no-files-found: error
          retention-days: 30

  android-functional-emulator:
    name: Verify live 200v200 debug combat and signed release startup
    needs: [qualification, signed-android]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android platform for headless runtime
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build debug verification APK from same commit
        run: gradle --no-daemon --stacktrace :android:assembleDebug
      - uses: actions/download-artifact@v4
        with:
          name: cd-signed-android-0.1.4-rc.1-${{ github.sha }}
          path: release
      - name: Require hardware-accelerated Android emulator (KVM)
        shell: bash
        run: |
          set -euo pipefail
          # GitHub-hosted Ubuntu exposes /dev/kvm to the kvm group, but the
          # runner account is not always a member. Without access the emulator
          # silently falls back to -accel off: the OS itself ANRs and the real
          # 200v200 gameplay proof cannot advance. Never accept that as PASS.
          test -c /dev/kvm || {
            echo 'BLOCKED: runner has no /dev/kvm; live 200v200 verification requires acceleration'
            exit 1
          }
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm || {
            echo 'BLOCKED: runner cannot access /dev/kvm; refusing unaccelerated emulator'
            exit 1
          }
          echo 'PASS: KVM device is accessible; Android emulator must still pass full 200v200 proof'
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 35 system_server/Settings ADB service crashed during emulator
          # initialization before test script launched on hosted Ubuntu.
          # API 34 remains a supported Android environment; retain the same
          # real 400-ship/render-loop/release-startup acceptance proof.
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none
          script: |
            bash tools/android_verify_demo.sh android/build/outputs/apk/debug/android-debug.apk test-output/android
            adb uninstall games.catastrophicdiplomacy
            adb install release/Catastrophic-Diplomacy-0.1.4-rc.1-Android.apk
            adb shell am start -W -n games.catastrophicdiplomacy/diplomacy.android.AndroidLauncher
            sleep 5
            adb shell pidof games.catastrophicdiplomacy
            adb exec-out screencap -p > test-output/android/signed-release-startup.png
            test "$(wc -c < test-output/android/signed-release-startup.png)" -gt 2000
            bash tools/android_verify_menu.sh test-output/android
      - name: Capture emulator infrastructure diagnostics on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p test-output/android
          timeout 10s adb devices -l > test-output/android/adb-devices-on-failure.txt 2>&1 || true
          timeout 25s adb logcat -d -v time > test-output/android/emulator-failure-logcat.txt 2>&1 || true
          echo "Emulator boot and runtime evidence retained; combat verification remains mandatory."
      - name: Retain functional emulator proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cd-release-functional-evidence-${{ github.sha }}
          path: test-output/android/
          if-no-files-found: warn
          retention-days: 30

  publish-prerelease:
    # This fixed 0.1.4-rc.1 tag is already published. Pushes still build and
    # exercise the signed APK; publication requires an explicit dispatch and
    # a vacant, version-bumped tag. Never overwrite a released APK.
    name: Publish verified signed Android prerelease (manual only)
    if: github.event_name == 'workflow_dispatch'
    needs: [qualification, signed-android, android-functional-emulator]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cd-signed-android-0.1.4-rc.1-${{ github.sha }}
          path: release
      - name: Publish signed Android prerelease after functional emulator pass
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=cd-v0.1.4-rc.1
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "BLOCKED: tag already exists; will not overwrite a release or rotate identity"
            exit 1
          fi
          gh release create "$tag" \
            release/Catastrophic-Diplomacy-0.1.4-rc.1-Android.apk \
            release/release-manifest.json release/SHA256SUMS.txt \
            release/signature-verification.txt release/package-identity.txt \
            --repo "$GH_REPO" --target "$GITHUB_SHA" \
            --title "Catastrophic Diplomacy 0.1.4 RC1 — integrated Android 200v200" \
            --prerelease \
            --notes "Cryptographically signed 200v200 Android release candidate. This is a published PRERELEASE, not a stable or Play Store release. Headless combat, six fighter classes, per-module research, hull repair and shield/drone support, and prerelease-updater policy pass CI. The debug 200v200 simulation, signed-release startup and normal main-menu to skirmish battle navigation passed emulator verification; physical-device install, same-signer upgrade/save retention, and hardware graphics quality remain outstanding. Existing runtime curated weapon VFX binaries are not certified. No production/Play approval is implied."
          echo "PASS: signed Android prerelease published after functional emulator evidence"
