name: Optional original-ship armor damage visual diagnostic
on:
  push:
    branches: [main]
    paths:
      - 'game/src/main/java/diplomacy/client/ShipArmorStamps.java'
      - 'game/src/main/java/diplomacy/client/ShipSurfaceDamageVisual.java'
      - 'game/src/main/java/diplomacy/client/ShipDamageScorch.java'
      - 'game/src/main/java/diplomacy/client/ShipImpactProfiles.java'
      - 'game/src/main/java/diplomacy/client/ShipSurfaceLighting.java'
      - 'game/src/main/java/diplomacy/client/TerranPlaceholderSprites.java'
      - 'game/src/main/java/diplomacy/client/ShipSurfaceSampleGrid.java'
      - 'game/src/main/java/diplomacy/client/ShipDamageMaskRegion.java'
      - 'game/src/main/java/diplomacy/client/ShipArmorStampAnchors.java'
      - 'game/src/test/java/diplomacy/client/ShipDamageMaskRegionTest.java'
      - 'core/src/test/java/diplomacy/sim/ArmorBreachTelemetry.java'
      - 'core/src/main/java/diplomacy/sim/DirectionalDefense.java'
      - 'core/src/test/java/diplomacy/sim/DirectionalDefenseTest.java'
      - 'core/build.gradle'
      - 'game/src/test/java/diplomacy/client/ShipSurfaceDamageVisualTest.java'
      - 'game/src/main/java/diplomacy/client/ShipSurfaceDamageFixture.java'
      - 'game/src/main/java/diplomacy/client/ShipSurfaceDamageCapture.java'
      - 'game/src/test/java/diplomacy/client/ShipSurfaceDamageCaptureTest.java'
      - 'tools/armor_visual_gallery.py'
      - 'docs/ARMOR_DAMAGE_STAMPS.md'
      - 'game/src/main/java/diplomacy/client/CatastrophicGame.java'
      - 'desktop/src/main/java/diplomacy/desktop/DesktopLauncher.java'
      - '.github/workflows/armor-damage-visual-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mask-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      # Independent workflow: failures are visible here, NEVER a release dependency.
      - name: Prove one impact generates only one visible damage anchor
        run: gradle --no-daemon :core:directionalDefenseSmoke
      - name: Inspect physical armor masks and cropped GPU updates
        run: gradle --no-daemon :game:shipDamageVisualSmoke
      - name: Verify deterministic real-weapon screenshot scenarios
        run: gradle --no-daemon :game:shipDamageCaptureSmoke
      - name: Measure actual time to armor exposure in fitted duels (diagnostic only)
        run: |
          mkdir -p test-output/armor-observation
          gradle --no-daemon :core:armorBreachTelemetry | tee test-output/armor-observation/lifetime.csv
      - name: Capture real armor-stage desktop OpenGL screenshots
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libgl1 libopenal1 python3-pil
          mkdir -p test-output/armor-observation/framebuffer
          export CD_ARMOR_CAPTURE_DIR="$PWD/test-output/armor-observation/framebuffer"
          export LIBGL_ALWAYS_SOFTWARE=1
          export ALSOFT_DRIVERS=null
          timeout --signal=INT --kill-after=10s 12m \
            xvfb-run -a -s "-screen 0 1280x720x24" gradle --no-daemon :desktop:run \
            2>&1 | tee test-output/armor-observation/framebuffer-run.log
          # Fail this optional workflow if actual captured evidence is missing.
          # Artwork quality observations are report warnings, NEVER release gates.
          python3 tools/armor_visual_gallery.py
      # One-click downloads per scenario; no multi-thousand-pixel microscopic sheet.
      - name: Preserve optional armor-readability measurements and framebuffer PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cd-armor-readability-${{ github.sha }}
          path: test-output/armor-observation/
          if-no-files-found: warn
          retention-days: 30
      - name: Downloadable pristine screenshot set
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cd-armor-pristine-${{ github.run_id }}
          path: test-output/armor-observation/individual/pristine/
          if-no-files-found: warn
          retention-days: 30
      - name: Downloadable shield-contact screenshot set
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cd-armor-shield-contact-${{ github.run_id }}
          path: test-output/armor-observation/individual/shield-contact/
          if-no-files-found: warn
          retention-days: 30
      - name: Downloadable laser-scoring screenshot set
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cd-armor-laser-scoring-${{ github.run_id }}
          path: test-output/armor-observation/individual/laser-scoring/
