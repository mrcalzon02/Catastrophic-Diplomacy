name: Optional armor live-fire and engineering diagnostic
# On-demand diagnostic: temporarily retired from automatic main-push CI.
# Its commands, seed matrix, test assertions and artifacts remain intact.
on:
  workflow_dispatch:

permissions:
  contents: read
# Latest push wins for this diagnostic. An explicit manual run has a
# unique concurrency group and never cancels either another manual run
# or a release. No current balance/style diagnostic blocks publication.
concurrency:
  group: cd-diagnostic-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  live-fire:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      # Test real simulation and infrastructure. Any durability preference
      # remains a separate balance observation, never a release blocker.
      - name: Run bare-target combat and fitted nine-rank armor engineering tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-output/armor-live-fire
          gradle --no-daemon :core:armorEngineeringSmoke :core:armorCombatTrial \
            :core:campaignAfterActionSmoke | tee test-output/armor-live-fire/results.log
      - name: Preserve live-fire and fitting test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cd-armor-live-fire-${{ github.sha }}
          path: test-output/armor-live-fire/
          if-no-files-found: warn
