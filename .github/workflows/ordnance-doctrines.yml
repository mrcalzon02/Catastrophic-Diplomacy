name: Physical missile doctrines and decoy countermeasure regression
on:
  push:
    branches: ['feature/physical-missile-salvos-decoy-doctrines-20261025']
  pull_request:
    paths: ['core/src/**', 'core/build.gradle', 'game/src/**', '.github/workflows/ordnance-doctrines.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mechanics:
    name: Real salvo/countermeasure physics and 200v200 regression
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify every missile mode with actual objects, ammo, point defense and deterministic replay
        run: |
          gradle --no-daemon --stacktrace \
            :core:ordnanceDoctrineSmoke :core:ammunitionTypesSmoke :core:weaponBehaviorSmoke \
            :core:projectileModuleSmoke :core:moduleResearchSmoke \
            :core:moduleVersionsSmoke :core:crewAccommodationSmoke \
            :core:fighterCraftSmoke :core:supportSystemsSmoke \
            :core:massBattleCampaign :game:classes :desktop:classes
