# Publish the already-tested three-platform run without rebuilding or retagging.
# This also verifies that the original 15 build/runtime jobs succeeded.
name: Recover verified 685 packages without new credentials
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-verified-685.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: cd-recover-verified-685
  cancel-in-progress: false
jobs:
  verified-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      CD_SOURCE_RUN: '41908916178'
      CD_SOURCE_SHA: '712d2d415ed9bfc8e27a8dd48e5eaddc1af01039'
      CD_RELEASE_TAG: cd-v0.1.5-dev.685
      CD_ANDROID_VERSION_NAME: 0.1.5-dev.685
    steps:
      - name: Require all fifteen original build and functional jobs and exact provenance
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$CD_SOURCE_RUN" > source-run.json
          gh api "repos/$GH_REPO/actions/runs/$CD_SOURCE_RUN/jobs?per_page=100" > source-jobs.json
          python3 - <<'PY'
          import json, os
          r=json.load(open('source-run.json'))
          jobs=json.load(open('source-jobs.json'))['jobs']
          sha=os.environ['CD_SOURCE_SHA']
          required=['linux','windows','android-build','android-runtime'] + [
              f'android-campaign-runtime ({i}, {i})' for i in range(11)]
          if not (r['name']=='Manual verified three-platform release'
              and r['head_branch']=='main' and r['event']=='push'
              and r['head_sha']==sha and r['run_number']==685
              and r['status']=='completed' and r['conclusion']=='failure'):
              raise SystemExit('BLOCKED: original release run provenance changed')
          for n in required:
              matches=[j for j in jobs if j['name']==n]
              if len(matches)!=1 or matches[0]['conclusion']!='success':
                  raise SystemExit('BLOCKED: required functional test not successful: '+n)
          if any(j['conclusion']=='failure' and j['name']!='publish' for j in jobs):
              raise SystemExit('BLOCKED: original run had nonpublication failures')
          print('PASS: exactly pinned three-platform build, Android 14 and all 11 Android 10 factions verified')
          PY
          relation="$(gh api "repos/$GH_REPO/compare/$CD_SOURCE_SHA...main" --jq .status)"
          if [[ "$relation" != identical && "$relation" != ahead ]]; then
            echo "BLOCKED: source no longer an ancestor of main ($relation)"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: cd-linux-41908916178
          path: dist
          run-id: 41908916178
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: cd-windows-41908916178
          path: dist
          run-id: 41908916178
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: cd-android-41908916178
          path: dist
          run-id: 41908916178
          github-token: ${{ github.token }}
      - name: Check binary integrity, create exact source tag, and publish all three tested packages
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c Catastrophic-Diplomacy-Linux-x64.zip.sha256
          sha256sum -c Catastrophic-Diplomacy-Windows-x64.msi.sha256
          sha256sum -c SHA256SUMS.txt
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          manifest=json.loads(Path('release-manifest.json').read_text())
          assert manifest['version']==os.environ['CD_ANDROID_VERSION_NAME']
          assert manifest['versionCode']==1685
          assert manifest['apk']['name']=='Catastrophic-Diplomacy-Android.apk'
          for f in ('Catastrophic-Diplomacy-Android.apk',
                    'Catastrophic-Diplomacy-Windows-x64.msi',
                    'Catastrophic-Diplomacy-Linux-x64.zip'):
              assert Path(f).stat().st_size>1000000,f
          PY
          if gh release view "$CD_RELEASE_TAG" -R "$GH_REPO" >/dev/null 2>&1; then
            echo "BLOCKED: the exact release tag already has a release; do not overwrite"
            exit 1
          fi
          # The original publish job was denied on --target because main
          # acquired newer workflow files. Create a source-exact git tag
          # first using existing Contents:write, then create the release with
          # --verify-tag and WITHOUT target_commitish. Never retag.
          if gh api "repos/$GH_REPO/git/ref/tags/$CD_RELEASE_TAG" >/dev/null 2>&1; then
            existing="$(gh api "repos/$GH_REPO/git/ref/tags/$CD_RELEASE_TAG" --jq .object.sha)"
            if [[ "$existing" != "$CD_SOURCE_SHA" ]]; then
              echo "BLOCKED: existing tag targets a different commit: $existing"
              exit 1
            fi
          else
            gh api -X POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$CD_RELEASE_TAG" \
              -f sha="$CD_SOURCE_SHA" --jq '.ref'
          fi
          tagged="$(gh api "repos/$GH_REPO/git/ref/tags/$CD_RELEASE_TAG" --jq .object.sha)"
          test "$tagged" = "$CD_SOURCE_SHA" || { echo "BLOCKED: tag provenance mismatch"; exit 1; }
          sha256sum Catastrophic-Diplomacy-Android.apk \
            Catastrophic-Diplomacy-Windows-x64.msi \
            Catastrophic-Diplomacy-Linux-x64.zip > FULL-SHA256SUMS.txt
          cat > notes.md <<EOF
          Verified Catastrophic Diplomacy Android, Windows, Linux prerelease.
          Exact original source commit: $CD_SOURCE_SHA
          Required functional checks: https://github.com/$GH_REPO/actions/runs/$CD_SOURCE_RUN
          All 15 build/runtime jobs passed: signed Android, eleven Android 10 faction campaign shards, Android 14 battle, Windows MSI installation/launch/uninstallation and Linux launch.
          Artwork and frame-rate diagnostics remain advisory, not functional release gates.
          EOF
          gh release create "$CD_RELEASE_TAG" -R "$GH_REPO" --verify-tag \
            --title "Catastrophic Diplomacy 0.1.5-dev.685 — Windows Linux Android" \
            --draft --prerelease --notes-file notes.md \
            Catastrophic-Diplomacy-Windows-x64.msi \
            Catastrophic-Diplomacy-Linux-x64.zip \
            Catastrophic-Diplomacy-Android.apk release-manifest.json \
            package-identity.txt signature-verification.txt FULL-SHA256SUMS.txt
          gh release view "$CD_RELEASE_TAG" -R "$GH_REPO" \
            --json tagName,isDraft,isPrerelease,assets \
            | jq -e --arg tag "$CD_RELEASE_TAG" '
              .tagName==$tag and .isDraft==true and .isPrerelease==true and
              ([.assets[].name] |
                index("Catastrophic-Diplomacy-Android.apk")!=null and
                index("Catastrophic-Diplomacy-Windows-x64.msi")!=null and
                index("Catastrophic-Diplomacy-Linux-x64.zip")!=null)'
          tagged="$(gh api "repos/$GH_REPO/git/ref/tags/$CD_RELEASE_TAG" --jq .object.sha)"
          test "$tagged" = "$CD_SOURCE_SHA"
          gh release edit "$CD_RELEASE_TAG" -R "$GH_REPO" --draft=false
          gh release view "$CD_RELEASE_TAG" -R "$GH_REPO" \
            --json tagName,isDraft,isPrerelease,assets \
            | jq -e --arg tag "$CD_RELEASE_TAG" '
              .tagName==$tag and .isDraft==false and .isPrerelease==true and
              ([.assets[].name] |
                index("Catastrophic-Diplomacy-Android.apk")!=null and
                index("Catastrophic-Diplomacy-Windows-x64.msi")!=null and
                index("Catastrophic-Diplomacy-Linux-x64.zip")!=null)'
          echo 'PASS: exact old source commit and three public packages verified after publication'
