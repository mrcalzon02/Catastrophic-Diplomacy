name: Optional PD vs flak simultaneous fighter-wave diagnostics
on:
  push:
    branches: [main]
    paths:
      - 'core/src/test/java/diplomacy/sim/PointDefenseWaveDiagnostic.java'
      - 'core/src/main/java/diplomacy/sim/Battle.java'
      - 'core/src/main/java/diplomacy/sim/SensorLightTimeHistory.java'
      - 'core/src/main/java/diplomacy/sim/OrdnanceSeeker.java'
      - 'core/src/main/java/diplomacy/sim/FighterCountermeasures.java'
      - 'core/src/main/java/diplomacy/sim/FighterInfraredSeeker.java'
      - 'core/src/main/java/diplomacy/sim/FighterRadarSeeker.java'
      - 'core/src/test/java/diplomacy/sim/FighterRadarSeekerTest.java'
      - 'core/src/test/java/diplomacy/sim/FighterInfraredSeekerTest.java'
      - 'core/src/test/java/diplomacy/sim/FighterCraftTest.java'
      - 'core/src/test/java/diplomacy/sim/FighterCountermeasureTest.java'
      - 'core/src/main/java/diplomacy/sim/GuidedTrajectoryPrediction.java'
      - 'core/src/test/java/diplomacy/sim/GuidedTrajectoryPredictionTest.java'
      - 'core/src/test/java/diplomacy/sim/OrdnanceSeekerTest.java'
      - 'core/src/test/java/diplomacy/sim/OrdnanceSeekerPhotonTest.java'
      - 'core/src/test/java/diplomacy/sim/GuidedSalvoCausalityTest.java'
      - 'core/src/test/java/diplomacy/sim/OrdnanceSubmunitionsTest.java'
      - 'core/src/main/java/diplomacy/sim/SensorActiveScan.java'
      - 'core/src/test/java/diplomacy/sim/SensorLightTimeHistoryTest.java'
      - 'core/src/test/java/diplomacy/sim/SensorActiveScanTest.java'
      - 'core/src/test/java/diplomacy/sim/SensorCausalAcquisitionTest.java'
      - 'core/src/test/java/diplomacy/sim/SensorHistoricalSignaturesTest.java'
      - 'core/src/test/java/diplomacy/sim/SensorTargetingSolutionTest.java'
      - 'core/src/main/java/diplomacy/sim/SensorTargetingSolution.java'
      - 'core/src/main/java/diplomacy/sim/SensorLeadProjection.java'
      - 'core/src/main/java/diplomacy/sim/RocketTrajectoryPrediction.java'
      - 'core/src/main/java/diplomacy/sim/RocketBarrage.java'
      - 'core/src/test/java/diplomacy/sim/RocketTrajectoryPredictionTest.java'
      - 'core/src/main/java/diplomacy/sim/BeamRayGeometry.java'
      - 'core/src/test/java/diplomacy/sim/SensorLeadProjectionTest.java'
      - 'core/src/test/java/diplomacy/sim/BeamRayGeometryTest.java'
      - 'core/src/test/java/diplomacy/sim/RocketBarrageTest.java'
      - 'game/src/main/java/diplomacy/client/SensorContactOverlay.java'
      - 'game/src/main/java/diplomacy/client/CatastrophicGame.java'
      - 'core/src/main/java/diplomacy/sim/SensorRelayBuffer.java'
      - 'core/src/main/java/diplomacy/sim/SensorFalseContactRelay.java'
      - 'core/src/test/java/diplomacy/sim/SensorFalseContactRelayTest.java'
      - 'core/src/test/java/diplomacy/sim/FleetSensorPhotonScaleDiagnostic.java'
      - 'core/src/test/java/diplomacy/sim/SensorRelayBufferTest.java'
      - 'core/src/main/java/diplomacy/sim/SensorTrackRelayBuffer.java'
      - 'core/src/main/java/diplomacy/sim/SensorComputeBudget.java'
      - 'core/src/test/java/diplomacy/sim/SensorComputeBudgetTest.java'
      - 'core/src/test/java/diplomacy/sim/SensorTrackRelayBufferTest.java'
      - 'core/src/test/java/diplomacy/sim/WeaponMuzzlesTest.java'
      - 'core/src/test/java/diplomacy/sim/SensingModulesTest.java'
      - 'core/src/test/java/diplomacy/sim/SensorNetworkModulesTest.java'
      - 'core/src/test/java/diplomacy/sim/SensorTacticalPictureTest.java'
      - 'core/build.gradle'
      - 'core/src/main/java/diplomacy/sim/WeaponMuzzles.java'
      - 'core/src/main/java/diplomacy/shipyard/Shipyard.java'
      - '.github/workflows/pd-flak-wave-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cd-pd-wave-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  measure-simultaneous-fighter-waves:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Verify objective sensor, weapons, rocket trajectory and game-client functionality
        id: mechanics
        run: gradle --no-daemon :core:weaponMuzzleSmoke :core:sensorNetworkSmoke :core:fighterCraftSmoke :core:rocketBarrageSmoke :game:compileJava
      - name: Measure optional PD/flak simultaneous fighter-wave balance
        id: wave
        continue-on-error: true
        run: gradle --no-daemon :core:pdFlakWaveDiagnostic
      - name: Profile optional full-scale sensor and photon integration
        id: fleet_sensor
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sensor-scale]') }}
        timeout-minutes: 8
        continue-on-error: true
        run: gradle --no-daemon :core:fleetSensorPhotonScaleDiagnostic
      - name: Report functional gate and advisory diagnostic independently
        if: always()
        run: |
          echo "## Physical combat functional verification and PD/flak balance" >> "$GITHUB_STEP_SUMMARY"
          echo "Java functional tests and client compile: ${{ steps.mechanics.outcome }} (required)" >> "$GITHUB_STEP_SUMMARY"
          echo "PD/flak fighter-wave balance: ${{ steps.wave.outcome }} (advisory)" >> "$GITHUB_STEP_SUMMARY"
          echo "16v16/200v200 sensor-photon profile: ${{ steps.fleet_sensor.outcome }} (advisory)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f core/test-output/fleet-sensor-photon-scale/summary.md ]; then
            cat core/test-output/fleet-sensor-photon-scale/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f core/test-output/pd-wave-diagnostic/summary.md ]; then
            cat core/test-output/pd-wave-diagnostic/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No wave metrics created. Inspect compilation and test logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve optional fleet sensor profile CSV and summary
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sensor-scale]')) }}
        uses: actions/upload-artifact@v4
        with:
          name: fitted-16v16-200v200-sensor-photon-profile
          path: core/test-output/fleet-sensor-photon-scale/
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve headless machine-readable test CSV and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pd-flak-simultaneous-fighter-wave-results
          path: core/test-output/pd-wave-diagnostic/
          if-no-files-found: warn
          retention-days: 30
