name: Battlespace timeline diagnostic
on:
  workflow_dispatch:
concurrency:
  group: cd-timeline-diag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless-timeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Six-speed simulated motion and pause/camera regression
        id: timeline
        continue-on-error: true
        run: |
          gradle --no-daemon :game:renderPosesSmoke :game:combatTimelineDiagnostic
      - name: Visual event cursor, hit feedback and live diagnostics smoke
        id: fx
        continue-on-error: true
        run: |
          gradle --no-daemon :game:combatHitFeedbackSmoke :game:lightingSmoke :game:combatPerformanceSmoke :game:laserFxDiagnostic
      - name: Preserve timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cd-combat-timeline-${{ github.run_id }}
          path: test-output/combat-timeline/
          if-no-files-found: warn
      - name: Report diagnostic result without blocking functional releases
        if: always()
        env:
          OUTCOME: ${{ steps.timeline.outcome }}
          FX_OUTCOME: ${{ steps.fx.outcome }}
        run: |
          if [ "$FX_OUTCOME" != "success" ]; then
            echo "::warning::Nonblocking FX/diagnostics regression failed"
          fi
          if [ "$OUTCOME" != "success" ]; then
            echo "::warning::Battlespace timeline diagnostic failed; inspect its log and evidence"
          else
            echo "PASS: scripted battlespace timing diagnostic"
          fi
