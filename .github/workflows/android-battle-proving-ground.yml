name: Android battle proving ground

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: combat-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Core combat + debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate release checklist coverage (not a release authorization)
        run: python3 tools/verify_apk_release_gate.py --checklist-only
      - name: Test deterministic weapon effects, complete 200v200 campaign, and package Android
        run: |
          gradle --no-daemon --stacktrace \
            :core:smoke :core:demoWeaponSmoke :core:massBattleCampaign \
            :desktop:classes :android:assembleDebug
      - name: Verify debug APK exists
        run: test -s android/build/outputs/apk/debug/android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
          retention-days: 14

  emulator:
    name: Android emulator 200v200 gameplay and framebuffer
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: android/build/outputs/apk/debug
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: bash tools/android_verify_demo.sh android/build/outputs/apk/debug/android-debug.apk test-output/android
      - name: Retain logcat, observed weapon telemetry, and actual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-200v200-evidence
          path: test-output/android/
          if-no-files-found: warn
          retention-days: 14
