name: Optional native 96px armor-mask authoring and inspection
on:
  push:
    branches: [main]
    paths:
      - 'tools/generate_damage_masks_96.py'
      - '.github/workflows/armor-mask-48-ab.yml'
  workflow_dispatch:

# Artwork generation is independent of release and never gates packages.
permissions:
  contents: write

concurrency:
  group: cd-armor96-authoring-${{ github.ref }}
  cancel-in-progress: false

jobs:
  author-native-masks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image authoring dependency
        run: python -m pip install Pillow==11.3.0
      - name: Produce all 42 authentic native-resolution RGBA masks
        run: |
          python tools/generate_damage_masks_96.py \
            --preview test-output/armor96/armor-96-variants.png
      - name: Audit asset dimensions and frame variety without cosmetic blocking
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          root=Path('assets/damage_masks/hires96')
          families=('laser','kinetic','plasma','particle','missile','torpedo','fighter')
          for family in families:
              with Image.open(root/(family+'.png')) as atlas:
                  assert atlas.size == (576,96) and atlas.mode == 'RGBA'
                  frames=[atlas.crop((i*96,0,(i+1)*96,96)) for i in range(6)]
                  assert len(set(frame.tobytes() for frame in frames))==6
                  for i,frame in enumerate(frames):
                      assert frame.getpixel((0,0))==(0,0,0,255), (family,i)
                  print('VALID',family,'96x96 x6')
          PY
      - name: Commit regenerated artwork without rewriting other development
        shell: bash
        run: |
          set -euo pipefail
          git add assets/damage_masks/hires96/*.png assets/damage_masks/hires96/audit.json
          if git diff --cached --quiet; then
            echo 'Native 96px atlases unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Store seven approved-size native 96px six-variant damage atlases'
          git fetch origin main
          # Never overwrite or automatically rebase another author's main work.
          if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]; then
            echo 'BLOCKED: main advanced during artwork generation; manual retry needed'
            exit 1
          fi
          git push origin HEAD:main
          HEAD_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$HEAD_SHA" = "$REMOTE_SHA" || {
            echo 'BLOCKED: remote main does not contain art generation commit'
            exit 1
          }
          echo "VERIFIED main=$REMOTE_SHA"
      - name: Keep original authored masks and the actual 96px preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cd-armor96-authored-${{ github.run_id }}
          path: |
            assets/damage_masks/hires96/
            test-output/armor96/armor-96-variants.png
          if-no-files-found: warn
          retention-days: 30
