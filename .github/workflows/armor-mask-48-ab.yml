name: Optional 48px damage-mask A/B original-ship framebuffer comparison
on:
  push:
    branches: [main]
    paths:
      - 'assets/damage_masks/ab/*.png'
      - 'game/src/main/java/diplomacy/client/ShipDamageImageMasks.java'
      - 'game/src/main/java/diplomacy/client/CapitalTurretSprites.java'
      - 'tools/armor_48_ab_compare.py'
      - '.github/workflows/armor-mask-48-ab.yml'
  workflow_dispatch:
permissions:
  contents: read
# Distinct diagnostic, never connected to release workflows.
concurrency:
  group: cd-armor48-ab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare-real-masks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Confirm same physically fired combat capture scenario
        run: gradle --no-daemon :game:shipDamageCaptureSmoke
      - name: Install headless GPU and image inspection dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libgl1 libopenal1 python3-pil
      - name: Capture A and B from real Battle.step OpenGL game
        shell: bash
        run: |
          set -euo pipefail
          export LIBGL_ALWAYS_SOFTWARE=1
          export ALSOFT_DRIVERS=null
          for MODE in upscaled48 authored48; do
            export CD_ARMOR_MASK_SET="$MODE"
            export CD_ARMOR_CAPTURE_DIR="$PWD/test-output/armor-ab/$MODE/framebuffer"
            mkdir -p "$CD_ARMOR_CAPTURE_DIR"
            echo "=== REAL SOURCE ART GAME CAPTURE: $MODE ==="
            timeout --signal=INT --kill-after=10s 13m \
              xvfb-run -a -s "-screen 0 1280x720x24" gradle --no-daemon :desktop:run \
              2>&1 | tee "test-output/armor-ab/$MODE/framebuffer-run.log"
            python3 tools/armor_visual_gallery.py
          done
          python3 tools/armor_48_ab_compare.py
      - name: Real 48px A/B side-by-side screenshot comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cd-armor48-actual-game-comparisons-${{ github.run_id }}
          path: test-output/armor-ab/comparisons/
          if-no-files-found: warn
          retention-days: 30
      - name: Actual OpenGL screenshots - upscaled old masks at 48px
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cd-armor48-upscaled48-real-framebuffer-${{ github.run_id }}
          path: test-output/armor-ab/upscaled48/
          if-no-files-found: warn
          retention-days: 30
      - name: Actual OpenGL screenshots - newly authored native 48px
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cd-armor48-authored48-real-framebuffer-${{ github.run_id }}
          path: test-output/armor-ab/authored48/
          if-no-files-found: warn
          retention-days: 30
