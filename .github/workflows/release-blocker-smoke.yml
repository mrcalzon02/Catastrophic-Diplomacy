# Focused objective release-blocker reproduction; deliberately does not package APK/MSI.
name: Release blocker focused functional regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-blocker-smoke.yml
      - core/src/main/java/diplomacy/shipyard/ApprovedHardpointResource.java
      - core/src/main/java/diplomacy/sim/Battle.java
      - core/src/main/java/diplomacy/tech/TechnologyCatalog.java
      - core/src/test/java/diplomacy/sim/LaserFamiliesTest.java
      - core/src/test/java/diplomacy/sim/TechnologyCatalogTest.java
      - core/src/test/java/diplomacy/sim/CombatMachineryTest.java
      - core/src/test/java/diplomacy/sim/BattleWeatherTest.java
      - core/src/test/java/diplomacy/sim/WeaponFxPipelineTest.java
      - core/src/test/java/diplomacy/sim/BattleOrdersTest.java
      - core/src/test/java/diplomacy/sim/ProjectileModuleTest.java
      - core/src/test/java/diplomacy/sim/MassBattleCampaignTest.java
      - core/src/test/java/diplomacy/sim/PhotonObservationCacheTest.java
      - core/src/test/java/diplomacy/sim/BattleStepPhaseObserverTest.java
      - core/src/test/java/diplomacy/sim/SweptProjectileBroadphaseTest.java
      - core/build.gradle
      - game/src/test/java/diplomacy/client/CombatViewBoundsTest.java
      - game/src/test/java/diplomacy/client/GameWikiTest.java
      - game/src/test/java/diplomacy/client/GameMenuFlowTest.java
      # Fitting/clearing a module is functional gameplay, not a visual gate.
      - game/src/main/java/diplomacy/client/ShipyardPanel.java
      - game/src/test/java/diplomacy/client/GuidedShipyardPanelTest.java
      - game/src/main/java/diplomacy/client/CombatPace.java
      - game/src/main/java/diplomacy/client/AdaptiveCombatPace.java
      - game/src/main/java/diplomacy/client/CombatDiagnosticRecorder.java
      - game/src/test/java/diplomacy/client/CombatPerformanceControlTest.java
      - game/build.gradle
      - game/src/main/java/diplomacy/client/InstancedShipRenderer.java
      - game/src/main/java/diplomacy/client/ShipInstanceBuckets.java
      - game/src/test/java/diplomacy/client/ShipInstanceBucketsTest.java
      - game/src/main/java/diplomacy/client/CatastrophicGame.java
      - game/src/main/java/diplomacy/client/GameWikiCatalog.java
      - core/src/test/java/diplomacy/sim/ApprovedHardpointsTest.java
      - tools/check_android_api26_compat.py

concurrency:
  group: cd-release-blockers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  objective-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Reject Java APIs unavailable on Android 10
        run: python3 tools/check_android_api26_compat.py
      - name: Reproduce every failed Windows and Linux functionality gate
        run: |
          gradle --no-daemon --continue \
            :core:laserFamiliesSmoke :core:technologySmoke \
            :core:combatMachinerySmoke :core:battleWeatherSmoke \
            :core:weaponFxSmoke :core:battleOrdersSmoke \
            :core:projectileModuleSmoke :game:combatVisibilitySmoke \
            :core:massMixedOnlySmoke :core:hardpointsLowHeapSmoke \
            :game:wikiSmoke :game:menuFlowSmoke
