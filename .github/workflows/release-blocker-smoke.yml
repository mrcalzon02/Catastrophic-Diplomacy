# One objective runtime smoke job; compile clients without packaging APK/MSI.
name: Release blocker focused functional regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-blocker-smoke.yml
      # Includes persistence, hbnet, multiplayer, and platform updater sources.
      - core/src/**
      - game/src/**
      - server/src/**
      - desktop/src/**
      - android/src/**
      - core/build.gradle
      - game/build.gradle
      - server/build.gradle
      - desktop/build.gradle
      - android/build.gradle
      - build.gradle
      - settings.gradle
      - gradle.properties
      - gradle/**
      - gradlew
      - gradlew.bat
      # Required runtime inputs, not optional artwork diagnostic scripts.
      - assets/**
      - asset_packs/**
      - tools/ApprovedHardpointBake.java
      - tools/ShipSurfaceMapGenerator.java
      - tools/generate_app_icons.py
      - tools/check_android_api26_compat.py
      - tools/prepare_android_update_manifest.py
      - tools/test_prepare_android_update_manifest.py
      - '!**/*.md'
      - '!**/*.markdown'

concurrency:
  group: cd-release-blockers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  objective-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install required Android icon compiler dependency
        run: python -m pip install Pillow==11.3.0
      - name: Prepare Android compile SDK
        run: |
          platform="$ANDROID_HOME/platforms/android-36/android.jar"
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          if [[ -f "$platform" && -d "$build_tools" ]]; then
            echo "Using preinstalled Android 36 / Build Tools 35.0.0"
            exit 0
          fi
          manager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          for attempt in 1 2 3; do
            if timeout 90s "$manager" --sdk_root="$ANDROID_HOME" \
                'platforms;android-36' 'build-tools;35.0.0'; then
              exit 0
            fi
            echo "Android SDK provisioning attempt $attempt failed; retrying with bounded backoff."
            sleep $((attempt * 5))
          done
          echo "Android SDK 36 / Build Tools 35.0.0 unavailable after bounded retries." >&2
          exit 1
      - name: Check Android runtime API compatibility and update manifests
        run: |
          python3 tools/check_android_api26_compat.py
          python3 tools/test_prepare_android_update_manifest.py
      - name: Compile clients and verify campaign, combat, updates and networking
        run: |
          gradle --no-daemon --continue \
            :desktop:compileJava :android:compileDebugJavaWithJavac \
            :core:gameFlowSmoke :core:campaignLedgerSmoke \
            :core:updaterPolicySmoke :core:desktopUpdaterPolicySmoke \
            :server:check :game:campaignRecoverySmoke \
            :core:laserFamiliesSmoke :core:technologySmoke \
            :core:combatMachinerySmoke :core:battleWeatherSmoke \
            :core:weaponFxSmoke :core:battleOrdersSmoke \
            :core:projectileModuleSmoke :game:combatVisibilitySmoke \
            :core:massMixedOnlySmoke :core:hardpointsLowHeapSmoke \
            :game:wikiSmoke :game:menuFlowSmoke
      # Art/style checks are advisory. They must not block runnable builds,
      # multiplayer, updater safety, or publish decisions. One job only.
      - name: Advisory projectile sprite footprint and atlas routing
        if: success()
        continue-on-error: true
        run: |
          gradle --no-daemon \
            :game:guidedOrdnanceArtSmoke \
            :game:kineticOrdnanceArtSmoke \
            :game:weaponStageArtSmoke
