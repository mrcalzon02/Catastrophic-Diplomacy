name: Remove three superseded build artifacts
on:
  push:
    branches: [main]
    paths: [".github/workflows/one-shot-remove-superseded-build-bundles.yml"]
permissions:
  actions: write
jobs:
  remove_exact_old_builds:
    if: github.repository == 'mrcalzon02/Catastrophic-Diplomacy' && github.event.head_commit.message == 'chore(ci): remove three superseded run 44862441127 build artifacts'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Remove only three pinned artifacts from the older run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo=mrcalzon02/Catastrophic-Diplomacy
          old=44862441127
          base=repos/$repo/actions
          targets=(14690526606 14691095007 14690193485)
          platforms=(android linux windows)
          prior=$(gh api "$base/runs/$old/artifacts?per_page=100")
          for i in "${!targets[@]}"; do
            jq -e --argjson id "${targets[$i]}" --arg name "cd-${platforms[$i]}-$old" \
              '[.artifacts[] | select(.id == $id and .name == $name and .expired == false)] | length == 1' <<< "$prior" >/dev/null
          done
          for id in "${targets[@]}"; do
            gh api --method DELETE "$base/artifacts/$id" --silent
            echo "Deleted old build artifact $id"
          done
          remaining=$(gh api "$base/runs/$old/artifacts?per_page=100")
          for id in "${targets[@]}"; do
            jq -e --argjson id "$id" '[.artifacts[] | select(.id == $id)] | length == 0' <<< "$remaining" >/dev/null
          done
          echo "Verified all three pinned old build artifacts are absent."
