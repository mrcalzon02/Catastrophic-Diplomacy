// Original source sheets are already stored as exact-byte Git blobs in a
// 20-part ZIP. Retain those binaries but never bundle the rejected 87-cell atlas.
// Reconstruct only reviewed UI entries from their source pixel rectangles.
def approvedUiParts = (0..<20).collect { file('asset_packs/ui-kit/part-' + String.format('%02d', it) + '.bin') }
def approvedUiOutput = layout.buildDirectory.dir('generated/cd-ui')
def curatedGrittyBackgrounds = file('asset_packs/gritty-ui/fullscreen-menu-backgrounds-v1.zip')

tasks.register('prepareUiAssets') {
    inputs.files approvedUiParts
    inputs.file file('assets/ui/tactical/selected_manifest.json')
    inputs.files fileTree('assets/ui/tactical/selected')
    inputs.file curatedGrittyBackgrounds
    outputs.dir approvedUiOutput
    doLast {
        approvedUiParts.each { if (!it.isFile()) throw new GradleException('Missing UI source part: ' + it.name) }
        def archive = layout.buildDirectory.file('tmp/approved-ui-sources.zip').get().asFile
        archive.parentFile.mkdirs()
        archive.withOutputStream { out ->
            approvedUiParts.each { part -> part.withInputStream { input -> input.transferTo(out) } }
        }
        def digestBytes = { byte[] data ->
            java.security.MessageDigest.getInstance('SHA-256').digest(data).encodeHex().toString()
        }
        if (digestBytes(archive.bytes) != '8220b70e36e7133f8bbb5d1d89dacc0a1b14ee12671c481d822454901f80a170')
            throw new GradleException('Original UI ZIP checksum mismatch')
        def rawSources = [
            systems: ['art_source/ui/ui_sheet_01_systems.png',
                      '3b74777d6c4a6dc8448fa0958f161b1b44967ef5a159a768bd36ca223e36417c'],
            combat: ['art_source/ui/ui_sheet_02_combat.png',
                     '7bca86a5ba6cb908f5985e34293157ccad0cb4fb23e4700112afc2f0b2622d26']
        ]
        def sources = [:]
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            rawSources.each { name, sourceInfo ->
                def entry = zip.getEntry(sourceInfo[0])
                if (entry == null) throw new GradleException('UI source not found: ' + name)
                byte[] bytes = zip.getInputStream(entry).withCloseable { it.bytes }
                if (digestBytes(bytes) != sourceInfo[1])
                    throw new GradleException('Altered UI source bytes: ' + name)
                def image = javax.imageio.ImageIO.read(new java.io.ByteArrayInputStream(bytes))
                if (image == null || image.width != 1536 || image.height != 1024)
                    throw new GradleException('Unexpected UI source dimensions: ' + name)
                sources[name] = image
            }
        }
        def manifest = new groovy.json.JsonSlurper().parse(
            file('assets/ui/tactical/selected_manifest.json'))
        if (manifest.schema != 'catastrophic-diplomacy-selected-ui-v5'
                || manifest.approved_only != true || manifest.assets.size() != 24)
            throw new GradleException('Unexpected UI approval manifest')
        def target = approvedUiOutput.get().asFile
        project.delete(target)
        target.mkdirs()
        manifest.assets.each { id, selection ->
            if (!(id ==~ /[a-z][a-z0-9_]*/)
                    || selection.destination != ('assets/ui/tactical/selected/' + id + '.png')
                    || !(selection.sheet in ['systems', 'combat'])
                    || !(selection.source ==~ /approved\/[a-z_]+\/[a-z_]+\/[a-z_0-9]+\.png/)
                    || !(selection.box instanceof java.util.List) || selection.box.size() != 4)
                throw new GradleException('Unsafe UI selection: ' + id)
            def original = sources[selection.sheet]
            def bounds = selection.box.collect { (it as Number).intValue() }
            int x = bounds[0], y = bounds[1], w = bounds[2] - bounds[0], h = bounds[3] - bounds[1]
            if (x < 0 || y < 0 || w < 16 || h < 16 || x + w > original.width || y + h > original.height)
                throw new GradleException('Bad UI crop bounds: ' + id)
            def crop = original.getSubimage(x, y, w, h)
            def pixelDigest = java.security.MessageDigest.getInstance('SHA-256')
            for (int yy = 0; yy < h; yy++) for (int xx = 0; xx < w; xx++) {
                int argb = crop.getRGB(xx, yy)
                pixelDigest.update((byte)(argb >> 16))
                pixelDigest.update((byte)(argb >> 8))
                pixelDigest.update((byte)argb)
                pixelDigest.update((byte)(argb >> 24))
            }
            if (pixelDigest.digest().encodeHex().toString() != selection.pixel_sha256)
                throw new GradleException('UI selected crop pixel mismatch: ' + id)
            // A manually imported, pinned PNG in assets/ shadows generated assets.
            // Reject differing replacements rather than accidentally shipping them.
            def installed = file(selection.destination)
            if (installed.isFile() && digestBytes(installed.bytes) != selection.sha256)
                throw new GradleException('Unapproved UI PNG in assets/: ' + id)
            def png = new File(target, 'ui/tactical/selected/' + id + '.png')
            png.parentFile.mkdirs()
            if (!javax.imageio.ImageIO.write(crop, 'png', png))
                throw new GradleException('Cannot encode reviewed UI sprite: ' + id)
        }
        if (!curatedGrittyBackgrounds.isFile() ||
                digestBytes(curatedGrittyBackgrounds.bytes) !=
                    'd44f38956bfb3e2ad35f4412902ee16027a90135760f80e67f80bd9f4ba4f1c4')
            throw new GradleException('Gritty background archive missing or changed')
        def backgrounds=[
            blank_armor_bulkhead:'7e2f2ecc428ca686bc6b5ef0c6c3ad3fa6fd298b0a0f395bba8a40fc227098ac',
            armored_interface:'0a4bb946c6d9908b68dd16a789f8ed4d029e8d6bbac519bd252817707f82ae50',
            tactical_star_chart:'615e978ea2eae40ebb52588f376d409d2ba86b8d29772a6c89dfdd0b359c7b08',
            fleet_approach:'b6057f3913863bfc1aaa82e68fd25f20c4ace052322f0603e09ca34ac25dad8d',
            shipyard_hangar:'d61cd628bc41e0e302d116afe49084f0667f2ee63caf3bd9e8e6214d3cd284ec'
        ]
        new java.util.zip.ZipFile(curatedGrittyBackgrounds).withCloseable { zip ->
            backgrounds.each { name, digest ->
                def entry=zip.getEntry('ui/gritty/backgrounds/'+name+'.jpg')
                if(entry==null)throw new GradleException('Missing curated background: '+name)
                byte[] bytes=zip.getInputStream(entry).withCloseable { it.bytes }
                if(digestBytes(bytes)!=digest)
                    throw new GradleException('Altered gritty background: '+name)
                def img=javax.imageio.ImageIO.read(new java.io.ByteArrayInputStream(bytes))
                if(img==null||img.width!=1280||img.height!=720)
                    throw new GradleException('Invalid full-screen background: '+name)
                def dest=new File(target,'ui/gritty/backgrounds/'+name+'.jpg')
                dest.parentFile.mkdirs()
                dest.bytes=bytes
            }
        }
        println('PASS: 24 vetted UI icons and 5 verified full-screen backgrounds generated.')
    }
}

/**
 * Fail builds rather than silently shipping an APK/desktop distribution
 * with placeholder-only weather assets. Both launchers consume assets/.
 */
tasks.register('verifyBattlefieldResources') {
    group = 'verification'
    description = 'Require the complete 49-PNG vetted weather library in the runtime asset root.'
    doLast {
        def inventory = ['asteroid_rock':8, 'asteroid_impact':8,
                         'asteroid_shockwave':7, 'ion_lightning':8,
                         'solar_beam':5, 'neutron_beam':5,
                         'radiation_motes':4, 'nebula_haze':4]
        def folder = file('assets/effects/weather')
        int present = 0
        inventory.each { prefix, count ->
            (0..<count).each { i ->
                def name = String.format(java.util.Locale.ROOT, '%s_%02d.png', prefix, i)
                def png = new File(folder, name)
                if (!png.isFile() || png.length() < 200) {
                    throw new GradleException('Missing vetted battlefield resource: ' + png)
                }
                png.withInputStream { input ->
                    byte[] header = new byte[8]
                    if (input.read(header) != 8 || !java.util.Arrays.equals(header,
                            [137,80,78,71,13,10,26,10].collect { (byte)it } as byte[]))
                        throw new GradleException('Invalid PNG header: ' + png)
                }
                present++
            }
        }
        println("PASS: ${present} approved battlefield PNG assets staged for packaging.")
    }
}

/**
 * Restore the Drive-sourced ambient MP3 from byte-exact Git parts.
 * The decoded file is an internal asset in both desktop and Android builds.
 */
def coldMusicParts = (0..<4).collect {
    file('asset_packs/music/cold-unresolved-' + String.format('%02d', it) + '.bin')
}
def coldMusicOutput = layout.buildDirectory.file('generated/cd-music/audio/music/cold_unresolved_drone.mp3')
tasks.register('prepareMusicAssets') {
    inputs.files coldMusicParts
    outputs.file coldMusicOutput
    doLast {
        coldMusicParts.each {
            if (!it.isFile()) throw new GradleException('Missing music transfer part: ' + it.name)
        }
        def target = coldMusicOutput.get().asFile
        target.parentFile.mkdirs()
        target.withOutputStream { output ->
            coldMusicParts.each { part -> part.withInputStream { input -> input.transferTo(output) } }
        }
        def sha = java.security.MessageDigest.getInstance('SHA-256')
        target.withInputStream { stream ->
            byte[] bytes = new byte[65536]
            int n
            while ((n = stream.read(bytes)) != -1) sha.update(bytes, 0, n)
        }
        def actual = sha.digest().encodeHex().toString()
        if (target.length() != 3558384 ||
                actual != '0e0b0e5bbad299d733938f907aa63fd62de9abad3dc61a00a8ee287fbe10a293') {
            target.delete()
            throw new GradleException('Drive music failed byte-level checksum verification')
        }
    }
}

/** Fail packaging when combat sound or soundtrack is missing. */
tasks.register('verifyBattleAudioResources') {
    dependsOn tasks.named('prepareMusicAssets')
    doLast {
        def sfx = ['laser_zap', 'metal_wonk', 'plasma_pulse',
                   'particle_arc', 'missile_launch', 'torpedo_launch',
                   'shield_hit', 'hollow_metal', 'grenade', 'ui_confirm']
        sfx.each { name ->
            def source = file('assets/audio/sfx/' + name + '.wav')
            if (!source.isFile() || source.length() < 44)
                throw new GradleException('Missing combat WAV: ' + source)
            source.withInputStream { input ->
                byte[] header = new byte[12]
                if (input.read(header) != 12 ||
                        new String(header, 0, 4, 'US-ASCII') != 'RIFF' ||
                        new String(header, 8, 4, 'US-ASCII') != 'WAVE')
                    throw new GradleException('Malformed combat WAV: ' + source)
            }
        }
        def music = file('assets/audio/music/final_surge.mp3')
        if (!music.isFile() || music.length() != 2686806)
            throw new GradleException('Missing or truncated battle soundtrack: ' + music)
        def sha = java.security.MessageDigest.getInstance('SHA-256')
        music.withInputStream { input ->
            byte[] data = new byte[65536]
            int n
            while ((n = input.read(data)) != -1) sha.update(data, 0, n)
        }
        if (sha.digest().encodeHex().toString() !=
                'fd1c8c713604f9bbe8f93b37e324f0918f2ddd62e1dc3bdbb4bb3543a6217c87')
            throw new GradleException('Battle soundtrack checksum mismatch')
        println('PASS: 10 combat/UI sound assets and two soundtrack recordings')
    }
}


/** Require exactly the vetted eight-control runtime atlas and the unbundled
 * archive provenance. Held/cropped candidates are never staged as runtime UI.
 */
tasks.register('verifyGrittyUiAssets') {
    group = 'verification'
    description = 'Verify pinned textless native button atlas and archive integrity.'
    def atlas = file('assets/ui/gritty/buttons_v1.png')
    def packs = [
        [file('asset_packs/gritty-ui/strict-01.zip'),
          '9e7e1ef4a9b7c0190df2bcf31d3ebb20fdbacd637bba40aefb20b6a307543b61',91],
        [file('asset_packs/gritty-ui/strict-02.zip'),
          'e6ff1b83bc6ab64996940f67744e7a2667b5422c0b78ba08646795b06f80ef0b',91],
        [file('asset_packs/gritty-ui/background-panels-v1.zip'),
          '5d601a5400bf803db0a6b0d5afea49013d23819253148cd54c31517b83636a7a',9]
    ]
    inputs.file atlas
    inputs.files packs.collect { it[0] }
    doLast {
        def digest = { file ->
            java.security.MessageDigest.getInstance('SHA-256')
                    .digest(file.bytes).encodeHex().toString()
        }
        if (!atlas.isFile() ||
                digest(atlas) != 'd17e36fc7cf6dd9cfb49ec6823b5b379e50f732de50b89af7117138ee852202c')
            throw new GradleException('Missing/altered gritty button atlas')
        def image = javax.imageio.ImageIO.read(atlas)
        if (image == null || image.width != 448 || image.height != 288)
            throw new GradleException('Unexpected gritty button atlas layout')
        packs.each { item ->
            def file = item[0]
            if (!file.isFile() || digest(file) != item[1])
                throw new GradleException('Missing/altered gritty source archive: ' + file.name)
            new java.util.zip.ZipFile(file).withCloseable { zip ->
                def names=zip.entries().toList().collect { it.name }
                int pngs=names.count { it.endsWith('.png') }
                if (pngs != item[2] || !names.contains(
                    file.name.startsWith('background')?'manifest.json':'selected_manifest.json'))
                    throw new GradleException('Unexpected gritty archive contents: '+file.name)
            }
        }
        println('PASS: 8 textless runtime button states, 182 strict source candidates and 9 isolated panels verified.')
    }
}


/**
 * Preserve the user's ORIGINAL legacy faction fleet sheets already committed
 * under assets/ships/alien/lineups/series-01/. Each of five original
 * civilizations gets its own 10 real ship textures, generated before Android
 * or desktop packs assets. No reused modern faction artwork, recolored blobs
 * or extra binary source downloads.
 *
 * This is an asset producer, not a CI design-quality release gate.
 */
def originalLegacyManifest = file('assets/ships/factions/legacy-sheets.json')
def originalLegacyOutput = layout.buildDirectory.dir('generated/cd-legacy-factions')
tasks.register('prepareLegacyFactionArt') {
    group = 'assets'
    description = 'Extract 50 real original legacy-faction hulls from five checksum-pinned fleet sprite sheets.'
    inputs.file originalLegacyManifest
    inputs.files fileTree('assets/ships/alien/lineups/series-01')
    outputs.dir originalLegacyOutput
    doLast {
        def spec = new groovy.json.JsonSlurper().parse(originalLegacyManifest)
        def roles = ['interceptor','corvette','missile_corvette','frigate','destroyer',
                     'light_cruiser','heavy_cruiser','battlecruiser','carrier','dreadnought']
        def factions = ['draxian','uzipt','mandrally','carnelian','zippledrow'] as Set
        if (spec.schema != 'cd-original-legacy-faction-sheets-v1' ||
            spec.roles != roles || spec.factions.size() != 5 ||
            (spec.factions.collect { it.id } as Set) != factions)
            throw new GradleException('Invalid original legacy fleet source register')
        def output = originalLegacyOutput.get().asFile
        project.delete(output)
        output.mkdirs()
        // Separators are based on the original sheet ship centers, not equal
        // 1/5 image strips (which amputate capital-ship wings and attach shards).
        int[] edges = [0,242,478,720,946,1254] as int[]
        int count = 0
        spec.factions.each { entry ->
            if (!(entry.id in factions) ||
                !(entry.sheet ==~ /[a-z0-9_]+\.png/))
                throw new GradleException('Invalid original faction source entry: ' + entry)
            def source = file(spec.source_root + entry.sheet)
            if (!source.isFile())
                throw new GradleException('Original faction source sheet missing: ' + source)
            def hash = java.security.MessageDigest.getInstance('SHA-256')
                    .digest(source.bytes).encodeHex().toString()
            if (hash != entry.sha256)
                throw new GradleException('Original Drive/Git artwork checksum mismatch: ' + source)
            def atlas = javax.imageio.ImageIO.read(source)
            if (atlas == null || atlas.width != 1254 || atlas.height != 1254)
                throw new GradleException('Legacy fleet source dimensions changed: ' + source)
            roles.eachWithIndex { role, index ->
                int col = index % 5
                int row = (int)(index / 5)
                int x0 = edges[col], x1 = edges[col + 1]
                int y0 = row == 0 ? 0 : 490
                int y1 = row == 0 ? 448 : 1138
                int width = x1-x0, height = y1-y0
                def rgba = new java.awt.image.BufferedImage(
                    width,height,java.awt.image.BufferedImage.TYPE_INT_ARGB)
                int minX=width,minY=height,maxX=-1,maxY=-1
                for (int y=0; y<height; y++) {
                    for (int x=0; x<width; x++) {
                        int pixel=atlas.getRGB(x0+x,y0+y)
                        int red=(pixel >>> 16)&255
                        int green=(pixel >>> 8)&255
                        int blue=pixel&255
                        int brightness=Math.max(red,Math.max(green,blue))
                        // Sheets were authored on black. Convert only their
                        // dark matte to transparency, preserving source RGB.
                        int alpha=brightness<=12?0:
                             Math.min(255,(int)(((brightness-12)*255)/30))
                        rgba.setRGB(x,y,(alpha<<24)|(pixel&0x00ffffff))
                        if(alpha>50) {
                            minX=Math.min(minX,x);minY=Math.min(minY,y)
                            maxX=Math.max(maxX,x);maxY=Math.max(maxY,y)
                        }
                    }
                }
                if(maxX<minX || maxY<minY || maxX-minX<20 || maxY-minY<40)
                    throw new GradleException('Empty or broken sprite extraction: '+entry.id+'/'+role)
                minX=Math.max(0,minX-2);minY=Math.max(0,minY-2)
                maxX=Math.min(width,maxX+3);maxY=Math.min(height,maxY+3)
                def sprite=rgba.getSubimage(minX,minY,maxX-minX,maxY-minY)
                def dest=new File(output,'ships/legacy_factions/'+entry.id+'/'+role+'.png')
                dest.parentFile.mkdirs()
                if (!javax.imageio.ImageIO.write(sprite,'png',dest) || dest.length()<1000)
                    throw new GradleException('Legacy fleet image generation failed: '+dest)
                count++
            }
        }
        if (count != 50)
            throw new GradleException('Legacy art registry did not generate 50 real sprites')
        println('PASS: 50 original Drive-sourced legacy faction hulls generated for both release platforms.')
    }
}


/**
 * Batch 001: user-recorded central game narrator. The original master and
 * editing WAVs are archived in the project's Drive Sounds folder; only
 * compressed production OGGs are embedded into each platform.
 */
def voiceArchive = file('asset_packs/audio/announcer-batch-001.zip')
def voiceRuntimeOutput = layout.buildDirectory.dir('generated/cd-announcer')
tasks.register('prepareAnnouncerVoiceAssets') {
    group = 'assets'
    description = 'Checksum-verify and stage all 30 original spoken announcer cues for Android and desktop.'
    inputs.file voiceArchive
    outputs.dir voiceRuntimeOutput
    doLast {
        if (!voiceArchive.isFile())
            throw new GradleException('Missing user-recorded announcer voice archive')
        def sha = java.security.MessageDigest.getInstance('SHA-256')
                .digest(voiceArchive.bytes).encodeHex().toString()
        if (sha != '646777366a257a15faea1e4ad5af742b5940f22d77c0fb3ad16e57b44bcd26ea')
            throw new GradleException('Announcer archive checksum mismatch')
        def dest = voiceRuntimeOutput.get().asFile
        project.delete(dest)
        def voices = new File(dest, 'audio/announcer')
        voices.mkdirs()
        new java.util.zip.ZipFile(voiceArchive).withCloseable { archive ->
            def manifestEntry = archive.getEntry('manifest.json')
            if (manifestEntry == null)
                throw new GradleException('Announcer cue manifest missing')
            byte[] manifestBytes = archive.getInputStream(manifestEntry).withCloseable { it.bytes }
            def manifest = new groovy.json.JsonSlurper().parseText(
                    new String(manifestBytes, 'UTF-8'))
            if (manifest.batch != '001' || manifest.clips.size() != 30)
                throw new GradleException('Unexpected announcer inventory')
            def seen = [] as Set
            manifest.clips.each { cue ->
                String rel = cue.ogg as String
                if (!(rel ==~ /ogg\/[0-9]{2}_[a-z0-9_]+\.ogg/) || !seen.add(rel))
                    throw new GradleException('Malformed or duplicate announcer clip path: ' + rel)
                def entry = archive.getEntry(rel)
                if (entry == null) throw new GradleException('Missing voice clip: ' + rel)
                byte[] bytes = archive.getInputStream(entry).withCloseable { it.bytes }
                if (bytes.length < 1000 ||
                        new String(bytes, 0, 4, 'US-ASCII') != 'OggS')
                    throw new GradleException('Invalid OGG voice clip: ' + rel)
                new File(voices, rel.substring(4)).bytes = bytes
            }
            new File(voices, 'manifest.json').bytes = manifestBytes
        }
        println('PASS: 30 original announcer OGG cues staged for desktop and Android')
    }
}
tasks.named('verifyBattleAudioResources') {
    dependsOn tasks.named('prepareAnnouncerVoiceAssets')
}


/**
 * Original fighter/cockpit spoken audio. Runtime copies are reconstructed only
 * from the ZIP supplied by the owner and transferred via Google Drive first.
 */
def fighterVoiceArchive = file('asset_packs/audio/fighter-voice-batch-003.zip')
def fighterVoiceRuntime = layout.buildDirectory.dir('generated/cd-fighter-voice')
tasks.register('prepareFighterVoiceAssets') {
    group = 'assets'
    description = 'Verify and stage 26 original interceptor voice clips for desktop and Android.'
    inputs.file fighterVoiceArchive
    outputs.dir fighterVoiceRuntime
    doLast {
        if (!fighterVoiceArchive.isFile())
            throw new GradleException('Missing original fighter voice archive')
        def sha256 = { byte[] bytes ->
            java.security.MessageDigest.getInstance('SHA-256')
                    .digest(bytes).encodeHex().toString()
        }
        if (sha256(fighterVoiceArchive.bytes) !=
                '82db162b06fccd39ff504ade08edc080f0e5c5c09f55430899f1e489a3ead861')
            throw new GradleException('Fighter voice archive checksum mismatch')
        def destination = fighterVoiceRuntime.get().asFile
        project.delete(destination)
        new File(destination,'audio/fighter').mkdirs()
        new java.util.zip.ZipFile(fighterVoiceArchive).withCloseable { archive ->
            def record = archive.getEntry('manifest.json')
            if (record == null) throw new GradleException('Fighter manifest absent')
            def manifest = new groovy.json.JsonSlurper().parseText(
                    archive.getInputStream(record).withCloseable {
                        new String(it.bytes, 'UTF-8')
                    })
            if (manifest.batch != '003' || manifest.hull != 'INTERCEPTOR'
                    || manifest.clips.size() != 26)
                throw new GradleException('Unexpected fighter voice inventory')
            def seen = [] as Set
            manifest.clips.each { clip ->
                String id = clip.id as String
                if (!(id ==~ /INTERCEPTOR_[A-Z_]+_0[12]/) || !seen.add(id))
                    throw new GradleException('Invalid or duplicate fighter cue '+id)
                String path = 'ogg/'+id.toLowerCase(java.util.Locale.ROOT)+'.ogg'
                String target = 'audio/fighter/'+id.toLowerCase(java.util.Locale.ROOT)+'.ogg'
                if (clip.ogg != path || clip.path != target)
                    throw new GradleException('Unexpected fighter cue mapping '+id)
                def entry = archive.getEntry(path)
                if (entry == null) throw new GradleException('Missing OGG cue '+id)
                byte[] bytes = archive.getInputStream(entry).withCloseable { it.bytes }
                if (bytes.length < 1000 || bytes.length != (clip.ogg_bytes as int)
                    || new String(bytes,0,4,'US-ASCII') != 'OggS'
                    || sha256(bytes) != clip.ogg_sha256)
                    throw new GradleException('Fighter voice content invalid '+id)
                new File(destination,target).bytes = bytes
            }
            new File(destination,'audio/fighter/manifest.json').bytes =
                    archive.getInputStream(record).withCloseable { it.bytes }
        }
        println('PASS: 26 user-recorded fighter lines staged on Android and desktop')
    }
}
tasks.named('verifyBattleAudioResources') {
    dependsOn tasks.named('prepareFighterVoiceAssets')
}


