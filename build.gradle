    [hull: 'CRUISER', batch: '010', file: file('asset_packs/audio/cruiser-voice-batch-010.zip'),
     checksum: '0d8e996fc8544b34796d575716f84ea25f6e38c993d9bdccf92be7c9a7523dc1'],
    [hull: 'LIGHT_CRUISER', batch: '011', file: file('asset_packs/audio/light-cruiser-voice-batch-011.zip'),
     checksum: '11437b903d0fae6e1eb68705ed402ce5d68c9e511459b2f0dce7fa0388be7d20']
]
def additionalHullVoicesOutput = layout.buildDirectory.dir('generated/cd-hull-voices')
tasks.register('prepareAdditionalHullVoiceAssets') {
    group = 'assets'
    description = 'Verify eight Drive-transferred hull voice archives and stage 208 original OGG clips.'
    inputs.files additionalHullVoicePacks.collect { it.file }
    outputs.dir additionalHullVoicesOutput
    doLast {
        def digest = { byte[] data ->
            java.security.MessageDigest.getInstance('SHA-256')
                    .digest(data).encodeHex().toString()
        }
        def root = additionalHullVoicesOutput.get().asFile
        project.delete(root)
        def target = new File(root, 'audio/hull_voice')
        target.mkdirs()
        additionalHullVoicePacks.each { pack ->
            if (!pack.file.isFile() || digest(pack.file.bytes) != pack.checksum)
                throw new GradleException('Missing or altered Drive-origin '+pack.hull+' voice ZIP')
            new java.util.zip.ZipFile(pack.file).withCloseable { archive ->
                def entry = archive.getEntry('manifest.json')
                if (entry == null) throw new GradleException('Missing '+pack.hull+' voice manifest')
                byte[] record = archive.getInputStream(entry).withCloseable { it.bytes }
                def manifest = new groovy.json.JsonSlurper().parseText(new String(record,'UTF-8'))
                if (manifest.hull != pack.hull || manifest.batch != pack.batch
                        || manifest.clips.size() != 26)
                    throw new GradleException('Invalid '+pack.hull+' voice manifest')
                def seen = [] as Set
                manifest.clips.each { cue ->
                    String id = cue.id as String
                    if (!(id ==~ /(?:CORVETTE|DESTROYER|CARRIER|DREADNOUGHT|BATTLECRUISER|MISSILE_FRIGATE|CRUISER|LIGHT_CRUISER)_[A-Z_]+_0[12]/)
                            || !id.startsWith(pack.hull+'_') || !seen.add(id))
                        throw new GradleException('Invalid/duplicate hull voice ID: '+id)
                    String filename = id.toLowerCase(java.util.Locale.ROOT)+'.ogg'
                    String path = 'ogg/'+filename
                    if (cue.ogg != path || cue.path != 'audio/hull_voice/'+filename)
                        throw new GradleException('Bad hull voice path: '+id)
                    def raw = archive.getEntry(path)
                    if (raw == null) throw new GradleException('Missing hull voice clip '+id)
                    byte[] bytes = archive.getInputStream(raw).withCloseable { it.bytes }
                    if (bytes.length < 1000 || bytes.length != (cue.ogg_bytes as int)
                            || new String(bytes,0,4,'US-ASCII') != 'OggS'
                            || digest(bytes) != cue.ogg_sha256)
                        throw new GradleException('Corrupt hull voice clip '+id)
                    new File(target,filename).bytes = bytes
                }
                // Reject incomplete or duplicated event banks even if the raw file count is 26.
                def expected = [] as Set
                ['ATTACK','DAMAGE','RETREAT','ESCAPE','COVER','LAUNCH','FIGHTER_ATTACK',
                 'SHIELDS_DOWN','LOW_AMMO','LOW_FUEL','CASUALTIES','SUPPORT','VICTORY'].each { event ->
                    (1..2).each { variant ->
                        expected.add(pack.hull+'_'+event+'_0'+variant)
                    }
                }
                if (seen != expected)
                    throw new GradleException('Incorrect event coverage for '+pack.hull)
                new File(target,pack.hull.toLowerCase(java.util.Locale.ROOT)+'-manifest.json').bytes = record
            }
        }
        println('PASS: 208 original hull voice clips verified across eight Drive-first archives')
    }
}
tasks.named('verifyBattleAudioResources') {
    dependsOn tasks.named('prepareAdditionalHullVoiceAssets')
}
