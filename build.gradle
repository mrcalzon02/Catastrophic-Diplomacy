/**
 * Production stage-1 runtime artwork. Original bytes are preserved in Git,
 * not at an external Drive URL or in a developer's private working tree.
 * Copying happens before BOTH desktop and Android asset packaging.
 */
def stage1Archive = file('asset_packs/stage1-runtime/approved.zip')
def stage1Output = layout.buildDirectory.dir('generated/cd-stage1')
tasks.register('prepareStage1Art') {
    group = 'assets'
    description = 'Restore 10 original Terran hull sprites and 35 original beam frames with SHA-256 verification.'
    inputs.file stage1Archive
    outputs.dir stage1Output
    doLast {
        if (!stage1Archive.isFile()) throw new GradleException('Missing original Terran/beam asset ZIP')
        def digest = { byte[] value ->
            java.security.MessageDigest.getInstance('SHA-256').digest(value).encodeHex().toString()
        }
        if (digest(stage1Archive.bytes) !=
                '5d1035bb7ca5684dd4027f22e73e46fe043cad2fa14356adb41349da9436aaaa')
            throw new GradleException('Original Stage 1 asset ZIP SHA-256 mismatch')
        def target = stage1Output.get().asFile
        project.delete(target)
        target.mkdirs()
        new java.util.zip.ZipFile(stage1Archive).withCloseable { archive ->
            def manifestEntry = archive.getEntry('runtime-art-manifest.json')
            if (manifestEntry == null) throw new GradleException('Missing original Stage 1 art manifest')
            def manifest = archive.getInputStream(manifestEntry).withCloseable { stream ->
                new groovy.json.JsonSlurper().parse(stream)
            }
            if (manifest.schema != 'cd-runtime-art-stage1-v1' ||
                    manifest.counts.terran_hulls != 10 ||
                    manifest.counts.emitter_free_beam_frames != 35 ||
                    manifest.counts.damage_and_shield_materials != 3 ||
                    manifest.files.size() != 48)
                throw new GradleException('Unexpected Stage 1 art inventory')
            int terran = 0, beams = 0, materials = 0
            manifest.files.each { name, record ->
                if (!(name ==~ /assets\/(ships\/terran|effects\/beams|materials)\/[a-z_0-9]+\.png/))
                    throw new GradleException('Unapproved Stage 1 path: ' + name)
                def entry = archive.getEntry(name)
                if (entry == null) throw new GradleException('Missing Stage 1 PNG: ' + name)
                byte[] original = archive.getInputStream(entry).withCloseable { it.bytes }
                if (original.length != (record.bytes as int) ||
                        digest(original) != record.sha256 ||
                        !java.util.Arrays.equals(java.util.Arrays.copyOf(original,8),
                                [137,80,78,71,13,10,26,10].collect { (byte)it } as byte[]))
                    throw new GradleException('Corrupted original Stage 1 PNG: ' + name)
                if (name.startsWith('assets/materials/')) {
                    // Three materials already exist as committed binaries; reject alteration.
                    def existing = file(name)
                    if (!existing.isFile() || digest(existing.bytes) != record.sha256)
                        throw new GradleException('Material differs from approved source: ' + name)
                    materials++
                } else {
                    if (name.startsWith('assets/ships/terran/')) terran++
                    else beams++
                    def dest = new File(target,name.substring('assets/'.length()))
                    dest.parentFile.mkdirs()
                    dest.bytes = original
                }
            }
            if (terran != 10 || beams != 35 || materials != 3)
                throw new GradleException('Stage 1 art incomplete: ' +
                        terran + ' Terran, ' + beams + ' beams, ' + materials + ' materials')
        }
        println('PASS: 10 Terran hull sprites + 35 beam frames restored from original Git archive.')
    }
}



// Combat munitions must not silently regress to colored circles in release
// packages. Use exact checksums of the two reviewed source-cropped bodies.
tasks.register('verifyGuidedOrdnanceSprites') {
    group = 'verification'
    description = 'Require the original source-cropped missile and torpedo bodies.'
    def originals = [
        'missile/payload_01.png':'a60e59ae9ef171cf1b37f816f975e25b72eddfd364544943601b09785179f4f2',
        'torpedo/payload_01.png':'08bece0712eaf2b91dbdb449d2b43f831f360aa8c656a4e994ec426d3c49777f'
    ]
    def inputsList = originals.keySet().collect { file('assets/effects/weapon_fx/' + it) }
    inputs.files inputsList
    doLast {
        def signature = [137,80,78,71,13,10,26,10].collect { (byte)it } as byte[]
        originals.each { name, sha ->
            def path = file('assets/effects/weapon_fx/' + name)
            if (!path.isFile()) throw new GradleException('Missing guided ordnance art: ' + name)
            byte[] raw = path.bytes
            def actual = java.security.MessageDigest.getInstance('SHA-256')
                .digest(raw).encodeHex().toString()
            if (raw.length < 1000 || !java.util.Arrays.equals(
                    java.util.Arrays.copyOf(raw,8), signature) || actual != sha)
                throw new GradleException('Corrupted original guided ordnance art: ' + name)
        }
        println('PASS: original guided missile and heavy torpedo PNGs present and unmodified')
    }
}

// Reconstruct the user's approved 63 laser/kinetic/plasma/particle firing and
// impact frames from the exact-byte Library source archive, transferred to Git
// as bounded base64 text blobs. No runtime network access or fallback-only builds.
def modularFxParts = (0..<20).collect {
    file('asset_packs/weapon-fx/part-' + String.format('%02d', it) + '.b64')
}
def modularFxOutput = layout.buildDirectory.dir('generated/cd-weapon-fx')
tasks.register('prepareModularWeaponFx') {
    group = 'assets'
    description = 'Restore and authenticate 63 original modular firing/impact PNGs.'
    inputs.files modularFxParts
    outputs.dir modularFxOutput
    doLast {
        modularFxParts.each { p ->
            if (!p.isFile()) throw new GradleException('Missing original weapon FX part ' + p)
        }
        def encoded = new StringBuilder(8670856)
        modularFxParts.eachWithIndex { p, i ->
            def part = p.getText('US-ASCII').trim()
            if (part.length() != (i == 19 ? 120856 : 450000)
                    || !(part ==~ /[A-Za-z0-9+\/=]+/))
                throw new GradleException('Invalid original FX transfer segment: ' + p.name)
            encoded.append(part)
        }
        byte[] archiveBytes = java.util.Base64.decoder.decode(encoded.toString())
        def digest = { byte[] b ->
            java.security.MessageDigest.getInstance('SHA-256').digest(b).encodeHex().toString()
        }
        if (archiveBytes.length != 6503142
                || digest(archiveBytes) != '1d65ce25dbe0fb4fccf0f85b6054fadf380b7ab8aaff3a9ce9129a39bcbf338a')
            throw new GradleException('Original modular FX archive SHA-256 mismatch')
        def archive = layout.buildDirectory.file('tmp/approved-modular-weapon-fx.zip').get().asFile
        archive.parentFile.mkdirs()
        archive.bytes = archiveBytes
        def output = modularFxOutput.get().asFile
        project.delete(output)
        output.mkdirs()
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            def manifestEntry = zip.getEntry('assets/effects/weapon_fx/extraction_manifest.json')
            if (manifestEntry == null) throw new GradleException('Original FX manifest absent')
            def manifest = zip.getInputStream(manifestEntry).withCloseable {
                new groovy.json.JsonSlurper().parse(it)
            }
            if (manifest.version != 1 || manifest.frameCount.firing_and_impact != 63
                    || manifest.frameCount.payload != 35
                    || manifest.frames.size() != 63 || manifest.payloadSha256.size() != 35)
                throw new GradleException('Unexpected original modular FX inventory')
            def expected = [:]
            ['laser', 'kinetic', 'particle', 'plasma'].each { family ->
                ['firing', 'impact'].each { phase ->
                    int count = family == 'plasma' && phase == 'firing' ? 7 : 8
                    (1..count).each { index ->
                        def name = 'assets/effects/weapon_fx/' + family + '/' + phase + '_' +
                                String.format('%02d', index) + '.png'
                        expected[name] = true
                    }
                }
            }
            if ((manifest.frames.keySet() as Set) != (expected.keySet() as Set))
                throw new GradleException('Unexpected curated FX names or missing frames')
            manifest.frames.each { name, metadata ->
                if (metadata.stage != (name.contains('/firing_') ? 'firing' : 'impact')
                        || !(metadata.status in ['CUTOUT_REVIEW_REQUIRED','APPROVED']))
                    throw new GradleException('Unexpected effect provenance metadata: ' + name)
                def source = zip.getEntry(name)
                if (source == null) throw new GradleException('Missing curated FX: ' + name)
                byte[] image = zip.getInputStream(source).withCloseable { it.bytes }
                if (digest(image) != metadata.sha256
                        || image.length < 1000
                        || !java.util.Arrays.equals(
                            java.util.Arrays.copyOf(image, 8),
                            [137,80,78,71,13,10,26,10].collect { (byte) it } as byte[]))
                    throw new GradleException('Damaged original weapon FX: ' + name)
                def destination = new File(output, name.substring('assets/'.length()))
                destination.parentFile.mkdirs()
                destination.bytes = image
            }
            // Beam payloads are already staged by prepareStage1Art. Verify
            // this source archive's payload identities but do not duplicate them.
            manifest.payloadSha256.each { name, sha ->
                if (!(name ==~ /assets\/effects\/beams\/(blue|red|green|gold|violet)_[0-9]{2}\.png/)
                        || digest(zip.getInputStream(zip.getEntry(name)).withCloseable { it.bytes }) != sha)
                    throw new GradleException('Original beam payload mismatch: ' + name)
            }
        }
        println('PASS: 63 source-checked modular weapon FX PNGs staged for Android and desktop')
    }
}

/**
 * The user's original five-faction, ten-roles-per-faction fighter art.
 * Binary chunks reconstruct the original ZIP byte-for-byte. Do not substitute
 * synthetic icons or arbitrary fleet-sheet crops for the approved craft.
 */
def originalFighterParts = (0..<13).collect {
    file('asset_packs/fighter-craft/part-' + String.format('%02d', it) + '.bin')
}
def originalFighterOutput = layout.buildDirectory.dir('generated/cd-fighters')
tasks.register('prepareFighterArt') {
    group = 'assets'
    description = 'Restore all 50 original fighter and drone ship sprites for combat.'
    inputs.files originalFighterParts
    outputs.dir originalFighterOutput
    doLast {
        originalFighterParts.each {
            if (!it.isFile()) throw new GradleException('Missing original fighter sprite ZIP part: ' + it)
        }
        def original = layout.buildDirectory.file('tmp/approved-fighter-craft.zip').get().asFile
        original.parentFile.mkdirs()
        original.withOutputStream { target ->
            originalFighterParts.each { part ->
                part.withInputStream { source -> source.transferTo(target) }
            }
        }
        def hash = { byte[] bytes ->
            java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()
        }
        if (hash(original.bytes) !=
                '11d9bd179f7cdb891c0a8aafdb83eb16d635a9d012c2de8b3996125015bbf2eb')
            throw new GradleException('Original 50-fighter sprite ZIP checksum mismatch')
        def destRoot = originalFighterOutput.get().asFile
        project.delete(destRoot)
        destRoot.mkdirs()
        def required = [
            'interceptor','superiority_fighter','assault_gunship','missile_fighter',
            'torpedo_bomber','recon_fighter','heavy_bomber','point_defense_fighter',
            'electronic_warfare','support_drone'
        ] as Set
        def factions = [
            'vaerith_prism','zelthar_luminari','nyx_biolith','umbra_foundry','aureate_synod'
        ] as Set
        new java.util.zip.ZipFile(original).withCloseable { archive ->
            def manifestEntry = archive.getEntry('manifest.json')
            if (manifestEntry == null) throw new GradleException('Fighter art manifest missing')
            def manifest = archive.getInputStream(manifestEntry).withCloseable { stream ->
                new groovy.json.JsonSlurper().parse(stream)
            }
            if (manifest.format != 'cd-fighters-v1' || manifest.count != 50 ||
                    manifest.ships.size() != 50)
                throw new GradleException('Unexpected original fighter asset count')
            def seen = [] as Set
            manifest.ships.each { ship ->
                if (!(ship.faction in factions) || !(ship.role in required) ||
                        ship.file != ship.faction + '/' + ship.role + '.png' ||
                        !seen.add(ship.file))
                    throw new GradleException('Invalid/duplicate fighter sprite: ' + ship.file)
                def entry=archive.getEntry(ship.file)
                if (entry == null) throw new GradleException('Original fighter sprite missing: ' + ship.file)
                byte[] content=archive.getInputStream(entry).withCloseable { it.bytes }
                if (content.length < 64 || !java.util.Arrays.equals(
                        java.util.Arrays.copyOf(content,8),
                        [137,80,78,71,13,10,26,10].collect { (byte)it } as byte[]))
                    throw new GradleException('Fighter sprite is not PNG: ' + ship.file)
                def image = javax.imageio.ImageIO.read(new java.io.ByteArrayInputStream(content))
                if (image == null || image.width != ship.size[0] || image.height != ship.size[1])
                    throw new GradleException('Original fighter sprite dimensions changed: ' + ship.file)
                def target=new File(destRoot,'ships/fighters/'+ship.file)
                target.parentFile.mkdirs()
                target.bytes=content
            }
            if (seen.size()!=50 || seen.collect { it.split('/')[0] }.toSet()!=factions)
                throw new GradleException('Fighter sprites are incomplete')
        }
        println('PASS: all 50 original fighter and drone sprites restored from Git.')
    }
}

