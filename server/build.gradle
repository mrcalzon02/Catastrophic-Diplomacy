plugins { id 'application' }
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }
dependencies { implementation project(':core') }
application { mainClass = 'diplomacy.server.OpenLanBattleServer' }
tasks.register('terminalProtocolSmoke', JavaExec) {
    group = 'verification'
    description = 'Verify real LAN stalemate, time-limit, winner and late spectator terminal messages.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.server.BattleTerminalProtocolTest'
}

tasks.register('networkSmoke', JavaExec) {
    dependsOn(tasks.named('terminalProtocolSmoke'))
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.server.BattleServerTest'
}
tasks.named('check') { dependsOn tasks.named('networkSmoke') }

tasks.register('pvpFleetSmoke', JavaExec) {
    group = 'verification'
    description = 'Verify authoritative trusted-LAN mixed-tier fleet and host tech-cap enforcement.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.server.PvpFleetTest'
}
tasks.named('networkSmoke') { finalizedBy(tasks.named('pvpFleetSmoke')) }

tasks.register('fleetLobbySmoke', JavaExec) {
    group = 'verification'
    description = 'Real two-client bounded fleet submission and host authorization.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.server.FleetLobbyTest'
}
tasks.named('pvpFleetSmoke') { finalizedBy(tasks.named('fleetLobbySmoke')) }

tasks.register('secureFleetLobbySmoke', JavaExec) {
    group = 'verification'
    description = 'Exercise the supported dedicated-JAR pinned-TLS submitted-fleet lobby entrypoint.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.server.TlsFleetLobbyLauncherTest'
}
tasks.named('fleetLobbySmoke') { finalizedBy(tasks.named('secureFleetLobbySmoke')) }
