plugins { id 'application' }
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }
dependencies { implementation project(':core') }
application { mainClass = 'diplomacy.server.BattleServer' }
tasks.register('networkSmoke', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.server.BattleServerTest'
}
tasks.named('check') { dependsOn tasks.named('networkSmoke') }

tasks.register('pvpFleetSmoke', JavaExec) {
    group = 'verification'
    description = 'Verify authoritative trusted-LAN mixed-tier fleet and host tech-cap enforcement.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.server.PvpFleetTest'
}
tasks.named('networkSmoke') { finalizedBy(tasks.named('pvpFleetSmoke')) }
