plugins { id 'java-library' }
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }
tasks.register('smoke', JavaExec) {
    group = 'verification'
    description = 'Java 17 deterministic battle smoke test without JUnit.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.sim.BattleSmokeTest'
    dependsOn testClasses
}

// Both deterministic combat and the packaged technology corpus are smoke-gated.
tasks.register('technologySmoke', JavaExec) {
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.sim.TechnologyCatalogTest'
    dependsOn testClasses
}
tasks.named('smoke') { finalizedBy(tasks.named('technologySmoke')) }


tasks.register('shipyardSmoke', JavaExec) {
    group = 'verification'
    description = 'Engineering fitting, technology application, battle integration and blueprint checks.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.sim.ShipyardTest'
    dependsOn testClasses
}
tasks.named('technologySmoke') { finalizedBy(tasks.named('shipyardSmoke')) }

// Portable fleet encoding and pointer gestures shared by the desktop/Android client.
tasks.register('platformSmoke', JavaExec) {
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.sim.PlatformPersistenceTest'
    dependsOn testClasses
}
tasks.named('technologySmoke') { finalizedBy(tasks.named('platformSmoke')) }

tasks.register('combatMachinerySmoke', JavaExec) {
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.sim.CombatMachineryTest'
    dependsOn testClasses
}
tasks.named('platformSmoke') { finalizedBy(tasks.named('combatMachinerySmoke')) }

tasks.register('fleetScaleSmoke', JavaExec) {
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.sim.FleetScaleTest'
    dependsOn testClasses
}
tasks.named('combatMachinerySmoke') { finalizedBy(tasks.named('fleetScaleSmoke')) }
