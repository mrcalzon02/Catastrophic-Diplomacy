}
tasks.register('spaceWeatherSmoke', JavaExec) {
    group = 'verification'
    description = 'Validate deterministic asteroid, flare, radiation, ion and neutron weather.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.sim.SpaceWeatherTest'
    dependsOn testClasses
}
tasks.register('battleWeatherSmoke', JavaExec) {
    group = 'verification'
    description = 'Verify environmental impacts on real battle shields, aim and systems.'
    classpath = sourceSets.test.runtimeClasspath
