tasks.named('levelEconomySmoke') { finalizedBy(tasks.named('skySmoke')) }
tasks.named('skySmoke') { finalizedBy(tasks.named('spaceWeatherSmoke')) }
tasks.named('spaceWeatherSmoke') { finalizedBy(tasks.named('battleWeatherSmoke')) }
tasks.named('battleWeatherSmoke') { finalizedBy(tasks.named('levelEnvironmentSmoke')) }

/** Armed aircraft profiles and each live nested weapon family, device-free. */
tasks.register('fighterCraftSmoke', JavaExec) {
    group = 'verification'
    description = 'Six independent craft classes, real nested ordnance, sensors, damage and replay.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.sim.FighterCraftTest'
}
tasks.named('combatMachinerySmoke') { finalizedBy(tasks.named('fighterCraftSmoke')) }
tasks.named('massBattleCampaign') { dependsOn tasks.named('fighterCraftSmoke') }

tasks.register('demoWeaponSmoke', JavaExec) {
    group = 'verification'
    description = 'Test exact Android 200v200 combined six-weapon fitted fixture and deterministic replay.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.sim.DemonstrationBattleTest'
    dependsOn testClasses
}

tasks.register('updaterPolicySmoke', JavaExec) {
    group = 'verification'
    description = 'Validate stable, prerelease and test-channel version, signature-origin and integrity policy.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.update.UpdatePolicyTest'
    dependsOn testClasses
}
tasks.named('levelEconomySmoke') { finalizedBy(tasks.named('updaterPolicySmoke')) }
