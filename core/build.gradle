    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.sim.BattleOrdersTest'
    dependsOn testClasses
}
tasks.named('weaponFxSmoke') { finalizedBy(tasks.named('battleOrdersSmoke')) }

tasks.register('projectileModuleSmoke', JavaExec) {
    group = 'verification'
    description = 'Verify fitted projectile speed/health/cross-section/signature and sensor-aware PD against live ordnance.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.sim.ProjectileModuleTest'
    dependsOn testClasses
}
tasks.named('battleOrdersSmoke') { finalizedBy(tasks.named('projectileModuleSmoke')) }

tasks.register('moduleResearchSmoke', JavaExec) {
    group = 'verification'
    description = 'Enforce one exclusive tech path per module and independent cross-module six-stage research.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.sim.ModuleResearchExclusivityTest'
    dependsOn testClasses
}
tasks.named('projectileModuleSmoke') { finalizedBy(tasks.named('moduleResearchSmoke')) }

tasks.register('supportSystemsSmoke', JavaExec) {
    group = 'verification'
    description = 'Prove six-level exclusive module tuning, self repair, ranged hull/shield beams and finite service drones.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.sim.SupportSystemsTest'
    dependsOn testClasses
}
tasks.named('moduleResearchSmoke') { finalizedBy(tasks.named('supportSystemsSmoke')) }




tasks.register('fleetScaleSmoke', JavaExec) {
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.sim.FleetScaleTest'
    dependsOn testClasses
}
tasks.named('combatMachinerySmoke') { finalizedBy(tasks.named('fleetScaleSmoke')) }

// Explicit heavy campaign: not automatically chained to routine smoke tests.
// No device/GPU coverage is implied by JavaExec success.
tasks.register('massBattleSmoke', JavaExec) {
    group = 'verification'
    description = 'Cross all scales 1v1 to 200v200; weapon/engine tech and 400-ship combined arms replays.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.sim.MassBattleCampaignTest'
    dependsOn testClasses
}
tasks.register('battleViewSmoke', JavaExec) {
    group = 'verification'
    description = 'Validate live vessel positions under the HUD in 1v1..200v200 and moving battles.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.sim.BattleViewTest'
    dependsOn testClasses
}
tasks.register('battleRasterSmoke', JavaExec) {
    group = 'verification'
    description = 'Rasterize all 400 hulls with Java2D to verify observable ship polygons; NOT GPU acceptance.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.sim.BattleGeometryRasterTest'
    dependsOn testClasses
}
tasks.register('massBattleCampaign') {
    group = 'verification'
    description = 'Run all exhaustive fleet, framing and headless raster acceptance suites.'
    dependsOn(tasks.named('massBattleSmoke'),tasks.named('battleViewSmoke'),tasks.named('battleRasterSmoke'))
}

tasks.register('directionalDefenseSmoke', JavaExec) {
    group = 'verification'
    description = 'Test directional shields, tile armor, structure exposure and typed damage.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.sim.DirectionalDefenseTest'
    dependsOn testClasses
}
// Preserve the existing routine smoke chain and include directional defenses.
tasks.named('fleetScaleSmoke') { finalizedBy(tasks.named('directionalDefenseSmoke')) }

tasks.register('levelEconomySmoke', JavaExec) {
    group = 'verification'
    description = 'Proof of deterministic 500-stage specifications and exact credit payouts.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.sim.LevelEconomyTest'
    dependsOn testClasses
}
tasks.named('directionalDefenseSmoke') { finalizedBy(tasks.named('levelEconomySmoke')) }

tasks.register('skySmoke', JavaExec) {
    group = 'verification'
    description = 'Reproduce all 500 seeded starfields without a graphics context.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'diplomacy.sim.LevelSkyTest'
